<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Expo Brasil">
<link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>

<style>
/* Kiosco vertical 9:16 · identidad ExpoCannabis Brasil 2026: verde profundo, lima, violeta y magenta; papel rasgado, trama de puntos y pinceladas */
:root{
  color-scheme:dark;
  --noche:#00432C; --noche2:#003A26; --surface:#0A5638; --surface2:#11664A; --line:rgba(198,240,50,.13);
  --violeta:#8A3FF2; --morado:#0A5638; --magenta:#F01F9A; --verde:#5FE08F; --lima:#C6F032; --celeste:#C6F032;
  --amarillo:#F2FF5C; --naranja:#F4F4EE; --rosa:#FF7CC8; --blanco:#FFFFFF; --gris:#4A4A4A;
  --fg:#F4F4EE; --lavanda:#B98CFF; --menta:#5FE08F; --muted:#A9CDB8; --ink:#062B1C; --lila:#B98CFF;
  --f-head:"Head","Arial Narrow",Impact,system-ui,sans-serif;
  --f-cond:"Head","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--noche);color:var(--fg)}
body{font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;border-radius:.5em}
svg.i{width:1.2em;height:1.2em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto;container-type:size;position:relative;overflow:hidden;background:var(--noche)}
.tex{display:none}
.shell{position:relative;height:100%;display:flex;flex-direction:column;font-size:clamp(11px,2.35cqw,32px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* encabezado */
.top{display:flex;align-items:center;gap:.7em;padding-block:.8em .45em}
.ed{flex:0 0 auto;background:var(--verde);color:var(--ink);border-radius:.55em;padding:.35em .5em;font-family:var(--f-head);line-height:.9;text-align:center;font-size:.9em}
.ed small{display:block;font-family:var(--f-cond);font-weight:800;font-size:.52em;letter-spacing:.06em}
.ed.ed-sm{display:inline-flex;align-items:center;gap:.35em;padding:.2em .6em;border-radius:999px;font-size:.7em;line-height:1}
.ed.ed-sm small{display:inline;font-size:.75em}
.brand{min-width:0;flex:1}
.brand{display:flex;align-items:center;gap:.7em}
.brand .logo{height:3.1em;width:auto;display:block;flex:0 0 auto}
.brand .meta{display:flex;flex-direction:column;gap:.3em;min-width:0}
.brand p{margin:0;display:flex;gap:.35em;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;padding:.2em .65em;font-weight:800;font-size:.68em;white-space:nowrap}
.pill{font-family:var(--f-cond)}
.pill.date{background:var(--gris);color:var(--blanco)}
.pill.date b{color:var(--blanco)}
.pill.aq{background:var(--celeste);color:var(--ink)}
.pill.mn{background:var(--menta);color:var(--ink)}
.clock{font-family:var(--f-cond);font-weight:800;font-size:.95em;letter-spacing:0;color:var(--amarillo);text-align:right;white-space:nowrap;line-height:1}
.clock small{display:block;font-family:var(--f-body);color:var(--muted);font-size:.42em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.toolbar{display:flex;gap:.4em;align-items:center;padding-bottom:.55em;min-width:0}
.langs{display:flex;gap:.15em;background:var(--surface);border-radius:999px;padding:.18em;flex:0 0 auto}
.langs button{padding:.3em .6em;border-radius:999px;font-weight:900;font-size:.74em;color:var(--muted);letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--celeste);color:var(--ink)}
.demo{flex:0 0 auto;font-size:.6em;letter-spacing:.14em;font-weight:900;color:var(--ink);background:var(--amarillo);padding:.3em .7em;border-radius:999px}
.livechip{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.45em;font-size:.74em;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.32em .75em;overflow:hidden}
.livechip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{width:.6em;height:.6em;border-radius:50%;background:var(--rosa);flex:0 0 auto;animation:rec 1.6s ease-in-out infinite}
@keyframes rec{50%{opacity:.35}}
.tbtn{flex:0 0 auto;display:flex;align-items:center;gap:.35em;background:var(--lavanda);color:var(--ink);padding:.38em .75em;border-radius:999px;font-size:.74em;font-weight:800}
.tbtn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:.38em .55em}

/* mapa */
.mapwrap{flex:1 1 auto;min-height:0;position:relative;margin-top:.1em;border-radius:1.1em;overflow:hidden;background:#0C0B28;border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
#map text{pointer-events:none}
#map .zl{font-family:var(--f-cond);font-weight:800;letter-spacing:.4px;fill:var(--fg)}
#map .zl.ink{fill:var(--ink)} #map .ink2{fill:#2E5A45}
#map .zs{font-family:var(--f-body);font-weight:700;fill:var(--muted)}
#map .sn{font-family:var(--f-body);font-weight:900;fill:var(--ink)}
#map .num{font-family:var(--f-head);fill:var(--blanco)}
#map .hit{cursor:pointer}
#map .hit .shape{transition:stroke-width .2s}
#map .hit.sel .shape{stroke:var(--ink);stroke-width:5}
#map .hit.sel{outline:none}
.mapwrap.picking #map .hit{cursor:crosshair}
.mapwrap.picking #map .hit:hover .shape{stroke-width:4}
#map .stand{transition:opacity .3s}
#map .stand.dim{opacity:.22}
#route{fill:none;stroke:var(--amarillo);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
#routeBase{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.where{position:absolute;left:.6em;bottom:.6em;max-width:calc(100% - 1.2em);display:flex;align-items:center;gap:.45em;background:var(--amarillo);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:.35em .9em .35em .6em;font-size:.76em;font-weight:800;text-align:left}
.where span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where u{text-decoration:none;background:var(--ink);color:var(--amarillo);border-radius:999px;padding:.1em .6em;margin-left:.2em;white-space:nowrap;flex:0 0 auto}
.mapwrap.picking{outline:3px dashed var(--amarillo);outline-offset:-3px}
.mapwrap.picking .where,.mapwrap.picking .spstrip{display:none}
.pickbar{position:absolute;left:.6em;right:.6em;bottom:.6em;background:var(--amarillo);color:var(--ink);border:2px solid var(--ink);border-radius:1em;padding:.6em .8em;display:flex;flex-direction:column;gap:.5em;font-weight:800;font-size:.85em}
.pickbtns{display:flex;gap:.4em}
.pb{flex:1;background:var(--ink);color:var(--amarillo);border-radius:999px;padding:.5em .8em;font-weight:800;font-size:.9em}
.pb.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.toast{position:absolute;left:50%;top:.6em;transform:translateX(-50%);background:var(--menta);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:.35em 1em;font-size:.78em;font-weight:800;white-space:nowrap;max-width:calc(100% - 1.2em);overflow:hidden;text-overflow:ellipsis;z-index:3}
.plist{display:flex;flex-direction:column;gap:.4em}
.pitem{display:flex;align-items:center;gap:.6em;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:.8em;padding:.5em .7em;font-weight:800;font-size:.88em}
.pitem .no{width:1.8em;height:1.8em;border-radius:50%;background:var(--c);color:var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-size:.85em;flex:0 0 auto}
.pitem.on{border-color:var(--amarillo);background:var(--surface2)}
.ph2{font-family:var(--f-head);font-size:1.3em;margin:0 0 .2em}
.spstrip{position:absolute;right:.6em;top:.6em;max-width:70%;display:flex;align-items:center;gap:.45em;background:rgba(0,52,34,.9);border:1px solid var(--line);border-radius:999px;padding:.32em .85em;font-size:.72em}
.spstrip .lv{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:.78em;letter-spacing:.06em}
.spstrip .nm{font-family:var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spstrip.swap{animation:swap .5s ease}
@keyframes swap{0%{opacity:.2;transform:translateY(.4em)}100%{opacity:1;transform:none}}

/* panel */
.panel{flex:0 0 39cqh;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-block:.6em max(.6em,env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:.35em;overflow-x:auto;scrollbar-width:none;padding-bottom:.55em;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:.4em;padding:.5em .9em;border-radius:999px;font-weight:900;font-size:.82em;background:var(--surface);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--blanco);color:var(--ink)}
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:.4em}
.pane>*{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(.6em);opacity:.4}to{transform:none;opacity:1}}
.filters{display:flex;flex-direction:column;gap:.45em;margin-bottom:.6em}
.search{width:100%;box-sizing:border-box;font:inherit;font-size:.9em;font-weight:700;padding:.6em 1em;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.search::placeholder{color:var(--muted);font-weight:400}
.chips{display:flex;gap:.35em;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:.4em;padding:.35em .8em;border-radius:999px;border:1.5px solid var(--line);font-size:.74em;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--blanco));color:var(--ink);background:var(--c,var(--blanco))}
.dot{width:.7em;height:.7em;border-radius:50%;flex:0 0 auto;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55em}
.empty{color:var(--muted);font-size:.85em;padding:1em 0}

/* tarjeta STAND */
.scard{display:flex;flex-direction:column;border-radius:1em;overflow:hidden;background:var(--c) var(--teximg) center/9em;background-blend-mode:luminosity;text-align:left;min-width:0}
.scard .hd{display:flex;align-items:center;gap:.45em;padding:.4em .55em;color:var(--ink);min-width:0}
.scard .no{width:1.75em;height:1.75em;border-radius:50%;background:var(--ink);color:var(--c);display:grid;place-items:center;font-family:var(--f-head);font-size:.85em;flex:0 0 auto}
.scard .hd small{font-weight:900;font-size:.66em;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.scard .star{font-size:.9em;flex:0 0 auto}
.scard .bd{background:var(--blanco);margin:0 .3em .3em;border-radius:.75em;padding:.55em .6em;display:flex;align-items:center;gap:.5em;min-height:2.6em}
.scard .bd b{font-family:var(--f-head);font-weight:400;color:var(--ink);font-size:1em;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.scard .bd img,.scard .bd .ico{width:2.3em;height:2.3em;border-radius:.5em;object-fit:cover;flex:0 0 auto}
.ico{display:grid;place-items:center;background:var(--ink);color:var(--c)}

/* filas de grilla */
.days{display:flex;gap:.35em;margin-bottom:.6em}
.days button{flex:1;padding:.5em;border-radius:999px;border:1.5px solid var(--line);font-weight:900;font-size:.82em;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--lavanda);background:var(--lavanda);color:var(--ink)}
.note{display:flex;align-items:center;gap:.5em;font-size:.68em;color:var(--muted);margin:-.2em 0 .6em;font-weight:700}
.rows{display:flex;flex-direction:column;gap:.4em}
.row{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:.7em;align-items:center;text-align:left;padding:.55em .8em;border-radius:.9em;background:var(--surface);border:1px solid var(--line)}
.row .t{font-family:var(--f-cond);font-weight:800;font-size:.92em;letter-spacing:0;color:var(--celeste);line-height:1}
.row b{display:block;font-size:.9em;font-weight:900}
.row small{display:block;color:var(--muted);font-size:.72em;margin-top:.1em}
.row.past{opacity:.42}
.row.is-live{border-color:var(--magenta);background:linear-gradient(90deg,rgba(240,31,154,.22),var(--surface) 70%)}
.badge{font-size:.6em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:.3em .6em;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:.4em}
.badge.live{background:var(--magenta);color:var(--blanco)}
.badge.next{border:1.5px solid var(--amarillo);color:var(--amarillo)}
.badge.room{border:1px solid var(--line);color:var(--muted)}
.badge.kind{background:var(--lima);color:var(--ink)}

/* listas genéricas */
.sec{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:.72em;letter-spacing:.1em;color:var(--muted);margin:.9em 0 .45em;display:flex;align-items:center;gap:.5em}
.sec:first-child{margin-top:0}
.fcard{display:flex;gap:.6em;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:.9em;padding:.4em;min-width:0}
.fcard img,.fcard .ico{width:3.2em;height:3.2em;border-radius:.65em;object-fit:cover;flex:0 0 auto}
.fcard .tx{min-width:0;flex:1}
.fcard b{display:block;font-family:var(--f-head);font-weight:400;font-size:.98em;line-height:1.05}
.fcard small{display:block;color:var(--muted);font-size:.7em;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sponsors y entradas */
.tier{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em}
.sp{border-radius:1em;padding:.8em .9em;text-align:left;display:flex;flex-direction:column;gap:.15em;min-width:0}
.sp .lv{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:.62em;letter-spacing:.1em}
.sp .nm{font-family:var(--f-head);font-size:1.25em;line-height:1}
.sp small{font-size:.7em;font-weight:700;opacity:.85}
.sp.main{grid-column:1/-1;border:2px dashed var(--amarillo);color:var(--fg)}
.sp.main .lv{color:var(--amarillo)}
.sp.oro{background:var(--amarillo);color:var(--ink)}
.sp.plata{background:#E8F5D0;color:var(--ink)}
.sp.media{background:var(--surface);border:1px solid var(--line)}
.sp.media .lv{color:var(--celeste)}
.fine{font-size:.68em;color:var(--muted);margin:.7em 0 0;line-height:1.4}
.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5em}
.ticket{position:relative;border-radius:1em;padding:.75em .9em;color:var(--ink);display:flex;flex-direction:column;gap:.1em;min-width:0}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:.9em;height:.9em;border-radius:50%;background:var(--noche);transform:translateY(-50%)}
.ticket::before{left:-.45em}.ticket::after{right:-.45em}
.ticket .nm{font-family:var(--f-head);font-size:1.05em;line-height:1.05}
.xp{margin-top:.8em;border:2px solid var(--c);border-radius:1em;overflow:hidden}
.xph{background:var(--c);color:var(--ink);font-family:var(--f-head);font-size:1.05em;padding:.45em .9em;text-transform:uppercase}
.xph b{font-weight:400}
.xp ul{list-style:none;margin:0;padding:.5em .9em;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35em .8em}
.xp li{display:flex;align-items:center;gap:.45em;font-size:.8em;font-weight:800;min-width:0}
.xp li img{width:1em;height:auto;flex:0 0 auto;opacity:.85}
.ticket small{font-size:.66em;font-weight:800}
.incl{display:flex;flex-wrap:wrap;gap:.35em}
.incl span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.25em .7em;font-size:.72em;font-weight:700}

/* ficha */
.sheet{position:absolute;inset:0;background:var(--noche2);border-radius:1.2em 1.2em 0 0;border:1px solid var(--line);border-bottom:0;z-index:5;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-in{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.hero{position:relative;height:10cqh;background:var(--c);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 9s ease-out both}
.hero.ill img{object-position:center 45%}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero .ico{width:100%;height:100%;background:var(--c);color:var(--ink);border-radius:0}
.hero .ico svg{width:5.5em;height:5.5em;stroke-width:1.4}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--noche2))}
.x{position:absolute;top:.5em;right:.5em;z-index:2;width:2.4em;height:2.4em;border-radius:50%;background:rgba(0,52,34,.85);display:grid;place-items:center}
.band{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;background:var(--c);color:var(--ink);padding:.45em .9em}
.band .no{width:1.9em;height:1.9em;border-radius:50%;background:var(--ink);color:var(--c);display:grid;place-items:center;font-family:var(--f-head)}
.band b{font-weight:900;font-size:.78em;letter-spacing:.08em;text-transform:uppercase}
.band .tg{font-size:.6em;font-weight:900;letter-spacing:.1em;padding:.2em .55em;border-radius:999px;background:var(--ink);color:var(--blanco)}
.band.speaker{background:var(--lima)}
.band.speaker b{font-family:var(--f-head);font-weight:400;font-size:1.05em;letter-spacing:.02em}
.body{padding:.7em 1em 1em;display:flex;flex-direction:column;gap:.65em}
.body h2{font-family:var(--f-head);font-weight:400;font-size:1.75em;line-height:1;margin:0;text-wrap:balance}
.body .desc{margin:0;font-size:.92em;line-height:1.45;max-width:40em}
.prods{background:var(--blanco);color:var(--ink);border-radius:.9em;padding:.6em .85em}
.prods .ph{display:flex;justify-content:space-between;align-items:center;gap:.5em;margin-bottom:.3em}
.prods .ph span:first-child{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:.72em;letter-spacing:.1em}
.ex{font-size:.58em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:var(--amarillo);color:var(--ink);padding:.25em .6em;border-radius:999px;white-space:nowrap}
.prod{display:flex;justify-content:space-between;gap:.8em;padding:.38em 0;border-top:1px dashed #CFC8EE;font-size:.88em}
.prod:first-of-type{border-top:0}
.prod b{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:.45em;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:.8em;padding:.4em .8em;display:flex;flex-direction:column}
.fact span{font-size:.6em;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.fact b{font-family:var(--f-cond);font-size:.95em;letter-spacing:0;font-weight:800;line-height:1.05}
.rnote{display:flex;align-items:center;gap:.6em;font-size:.8em;font-weight:800;color:var(--amarillo)}
.rnote i{width:1.8em;height:.35em;border-radius:1em;background:var(--amarillo);flex:0 0 auto}

/* bienvenida */
.attract{position:absolute;inset:0;z-index:50;overflow:hidden;cursor:pointer;background:var(--noche);font-size:clamp(11px,2.35cqw,32px)}
.attract .bg{position:absolute;inset:0;background:var(--bgimg) center/cover no-repeat}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
.a-in{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:max(1.6em,env(safe-area-inset-top,0px)) max(1.4em,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.a-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;max-width:30em}
.slot{border:2px dashed rgba(255,255,255,.35);border-radius:.7em;padding:.6em .8em;font-size:.6em;font-weight:900;letter-spacing:.12em;color:rgba(255,255,255,.6);background:rgba(0,52,34,.55)}
.a-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.8em;max-width:19em}
.a-kick{font-family:var(--f-head);font-size:1.3em;text-transform:uppercase;letter-spacing:.02em}
.a-kick span{color:var(--magenta)}
.a-logo{width:min(100%,16em);height:auto;display:block;animation:float 5.5s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(.15em) scale(1)}to{transform:translateY(-.3em) scale(1.02)}}
.lema{font-family:var(--f-head);font-weight:400;font-size:3.4em;line-height:.9;margin:.1em 0 0;text-transform:uppercase;display:flex;align-items:center;gap:.22em}
.lema .cx{height:.95em;width:auto;display:block;animation:spin 7s ease-in-out infinite}
@keyframes spin{0%,62%{transform:rotate(0) scale(1)}81%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.a-sub{font-size:1.02em;font-weight:700;line-height:1.4;margin:0;color:var(--fg);background:rgba(0,52,34,.6);padding:.4em .8em;border-radius:.8em}
.a-pills{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center}
.a-pills .pill{font-size:.85em}
.touch{display:flex;align-items:center;gap:.7em;font-family:var(--f-head);font-size:1.5em;margin-top:.3em;background:var(--celeste);color:var(--ink);padding:.45em 1.1em;border-radius:999px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.15em) scale(1.03)}}
.touch{position:relative}
.touch::before,.touch::after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid var(--celeste);pointer-events:none;animation:ring 3s ease-out infinite}
.touch::after{animation-delay:.5s}
@keyframes ring{0%{transform:scale(1);opacity:.85}55%,100%{transform:scale(1.18,1.7);opacity:0}}
.a-langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45em;width:100%;max-width:19em;margin-top:.3em}
.a-langs button{padding:.7em .8em;border-radius:999px;background:rgba(0,52,34,.92);border:1px solid var(--line);font-weight:900;font-size:.9em;display:flex;justify-content:space-between;align-items:center}
.a-langs button span{font-family:var(--f-cond);font-weight:800;font-size:.8em;color:var(--celeste)}
.a-foot{width:100%;max-width:30em;display:flex;flex-direction:column;gap:.55em}
.ticker{overflow:hidden;white-space:nowrap;border-radius:999px;background:rgba(0,52,34,.88);border:1px solid var(--line);padding:.55em 0}
.ticker-track{display:inline-flex;gap:2.2em;padding-left:100%;animation:tick 30s linear infinite;font-family:var(--f-head);font-size:.95em}
.ticker-track span{color:var(--fg);display:inline-flex;align-items:center;gap:.5em} .ticker-track em{font-style:normal;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:.7em;letter-spacing:.08em;color:var(--amarillo)} .ticker-track img{height:1em;width:auto;opacity:.8}
@keyframes tick{to{transform:translateX(-100%)}}
.a-meta{display:flex;justify-content:space-between;align-items:center;gap:.6em;font-size:.75em;font-weight:700;color:var(--muted)}

/* QR */
.modal{position:absolute;inset:0;z-index:60;background:rgba(0,52,34,.9);display:grid;place-items:center;padding:1em;font-size:clamp(11px,2.35cqw,32px)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:1.2em;padding:1.4em;max-width:22em;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:.8em;text-align:center}
.mcard h3{font-family:var(--f-head);font-weight:400;font-size:1.5em;margin:0;text-wrap:balance}
.mcard p{margin:0;color:var(--muted);font-size:.85em;line-height:1.4}
#qr{background:#fff;padding:.8em;border-radius:.8em;line-height:0}
#qr img,#qr canvas{width:11em;height:11em;max-width:100%}
.btn{width:100%;padding:.75em;border-radius:999px;font-weight:900;background:var(--celeste);color:var(--ink)}

/* vistas */
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;animation:viewIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(1.2em) scale(.985)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:max(1em,env(safe-area-inset-bottom,0px))}
.scroll::-webkit-scrollbar{display:none}
.vhead{display:flex;align-items:center;gap:.6em;padding:.2em 0 .7em}
.back{display:flex;align-items:center;gap:.35em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.4em .85em .4em .6em;font-weight:800;font-size:.8em;flex:0 0 auto}
.back svg{transform:rotate(180deg)}
.vhead h2{font-family:var(--f-head);font-weight:400;font-size:1.6em;line-height:1;margin:0;min-width:0}
.vhead small{display:block;font-family:var(--f-body);font-size:.45em;color:var(--muted);font-weight:700;margin-top:.25em}
.stagger>*{animation:rise2 .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise2{from{opacity:0;transform:translateY(1.4em) scale(.96)}to{opacity:1;transform:none}}
button:active{transform:scale(.97)}
.kb{animation:kbloop 16s ease-in-out infinite alternate}
@keyframes kbloop{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2%,-1%)}}

/* inicio / dashboard */
.dhero{position:relative;border-radius:1.2em;overflow:hidden;height:19cqh;margin-bottom:.6em;border:1px solid var(--line);flex:0 0 auto}
.dhero video,.dhero .vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.dhero .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.3em;padding:0 1em}
.dhero h2{font-family:var(--f-head);font-weight:400;font-size:2.2em;line-height:.95;margin:0;text-wrap:balance}
.dhero p{margin:0;font-weight:700;color:var(--muted);font-size:.85em}
.dhero .spinx{width:2.2em;height:auto;animation:slowspin 14s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.tile{position:relative;border-radius:1.2em;overflow:hidden;text-align:left;min-width:0;min-height:9.5em;background:var(--c,var(--surface));color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;border:2px solid var(--ink);isolation:isolate}
.tile.wide{grid-column:1/-1}
.tile .media{position:absolute;inset:0;z-index:-1;overflow:hidden}
.tile .media img,.tile .media video{width:100%;height:100%;object-fit:cover;display:block}
.tile .lab{background:var(--blanco);margin:.45em;border-radius:.85em;padding:.5em .7em;display:flex;align-items:center;gap:.5em;border:2px solid var(--ink)}
.tile .lab b{font-family:var(--f-head);font-weight:400;font-size:1.15em;line-height:1;display:block}
.tile .lab small{display:block;font-size:.68em;font-weight:800;color:#2E5A45;margin-top:.15em}
.tile .lab .tx{min-width:0;flex:1}
.tile .lab .go{width:1.9em;height:1.9em;border-radius:50%;background:var(--ink);color:var(--c,var(--amarillo));display:grid;place-items:center;flex:0 0 auto}
.tile .lab .go svg{width:1em;height:1em}
.tile.tall{min-height:13em}
.tile .strip{position:absolute;top:.5em;left:.5em;right:.5em;display:flex;gap:.35em;flex-wrap:wrap}
.tile .strip span{background:var(--blanco);border:1.5px solid var(--ink);border-radius:999px;padding:.15em .55em;font-size:.62em;font-weight:900;font-family:var(--f-cond)}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
.mosaic>*{overflow:hidden;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic .ico{width:100%;height:100%;border-radius:0}
.mosaic .ico svg{width:45%;height:45%}
.livecard{display:flex;align-items:center;gap:.7em;background:var(--rosa);color:var(--ink);border:2px solid var(--ink);border-radius:1.1em;padding:.6em .8em;text-align:left;margin-bottom:.6em;width:100%;box-sizing:border-box}
.livecard .ic{width:2.4em;height:2.4em;border-radius:50%;background:var(--ink);color:var(--rosa);display:grid;place-items:center;flex:0 0 auto}
.livecard .tx{min-width:0;flex:1}
.livecard b{display:block;font-family:var(--f-head);font-weight:400;font-size:1.1em;line-height:1.05}
.livecard small{display:block;font-size:.72em;font-weight:800;margin-top:.1em}
.livecard .k{font-family:var(--f-cond);font-weight:800;font-size:.62em;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:.4em}
.livecard .rec{background:var(--magenta)}
.mapmini{position:absolute;inset:0}
.eq{display:flex;align-items:flex-end;gap:.12em;height:1.1em}
.eq i{width:.22em;border-radius:.1em;background:var(--rosa);animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:.7s}.eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.1s}.eq i:nth-child(4){animation-delay:-.15s;animation-duration:.8s}
@keyframes eq{from{height:20%}to{height:100%}}
/* dashboard v3: grilla pareja de botones tipo sticker */
.dgrid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75em .65em;padding-bottom:.5em}
.dtile{position:relative;display:flex;flex-direction:column;min-width:0;min-height:max(11em,19cqh);border-radius:1.1em;border:2px solid var(--ink);background:var(--c);color:var(--ink);text-align:left;overflow:hidden;box-shadow:0 .32em 0 var(--ink);margin-bottom:.32em;transition:transform .12s ease,box-shadow .12s ease;isolation:isolate}
.dtile:active{transform:translateY(.28em)!important;box-shadow:0 .04em 0 var(--ink)}
.dtile .art{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--c) var(--teximg) center/9em;background-blend-mode:luminosity;display:grid;place-items:center}
.dtile .art>img:not(.xm),.dtile .art>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dtile .art .big{width:3.4em;height:3.4em;stroke-width:1.3;color:var(--ink)}
.dtile .art .xm{width:38%;height:auto;filter:invert(1) brightness(.2)}
.dtile .art .mosaic{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.dtile .foot{display:flex;align-items:center;gap:.45em;background:var(--c);border-top:2px solid var(--ink);padding:.5em .55em .5em .7em}
.dtile .foot .tx{min-width:0;flex:1}
.dtile .foot b{display:block;font-family:var(--f-head);font-weight:400;font-size:1.12em;line-height:1}
.dtile .foot small{display:block;font-size:.66em;font-weight:800;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.dtile .go{width:1.9em;height:1.9em;border-radius:50%;background:var(--ink);color:var(--c);display:grid;place-items:center;flex:0 0 auto}
.dtile .go svg{width:1em;height:1em}
.dtile .badge2{position:absolute;top:.45em;left:.45em;z-index:1;background:var(--blanco);border:1.5px solid var(--ink);border-radius:999px;padding:.12em .55em;font-family:var(--f-cond);font-weight:800;font-size:.6em}
.mapmini svg{width:100%;height:100%;display:block}

/* locales */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55em}
.ctile{position:relative;border-radius:1.1em;overflow:hidden;min-height:8.5em;border:2px solid var(--ink);background:var(--c);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;min-width:0}
.ctile .media{position:absolute;inset:0;z-index:-1}
.ctile .media img,.ctile .media video{width:100%;height:100%;object-fit:cover;display:block}
.ctile .media .ico{width:100%;height:100%;border-radius:0;background:var(--c) var(--teximg) center/9em;background-blend-mode:luminosity;color:var(--ink)}
.ctile .media .ico svg{width:3.4em;height:3.4em;stroke-width:1.4}
.ctile .lab{background:var(--blanco);color:var(--ink);margin:.4em;border-radius:.8em;border:2px solid var(--ink);padding:.4em .6em;display:flex;align-items:center;gap:.5em}
.ctile .lab b{font-family:var(--f-head);font-weight:400;font-size:1em;line-height:1.05;flex:1;min-width:0}
.ctile .lab .n{background:var(--ink);color:var(--blanco);border-radius:999px;font-family:var(--f-cond);font-weight:800;font-size:.7em;padding:.2em .55em;flex:0 0 auto}
.list1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55em}
.cbanner{position:relative;height:14cqh;border-radius:1.1em;overflow:hidden;border:2px solid var(--ink);margin-bottom:.7em;background:var(--c)}
.cbanner img,.cbanner video{width:100%;height:100%;object-fit:cover;display:block}
.cbanner .ico{width:100%;height:100%;border-radius:0;background:var(--c) var(--teximg) center/9em;background-blend-mode:luminosity;color:var(--ink)}
.cbanner .ico svg{width:4em;height:4em}

/* agenda */
.seg{display:flex;gap:.3em;background:var(--surface);border-radius:999px;padding:.25em;margin-bottom:.55em}
.seg button{flex:1;padding:.55em .4em;border-radius:999px;font-weight:900;font-size:.8em;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:.35em}
.seg button[aria-pressed="true"]{background:var(--blanco);color:var(--ink)}

/* mapa: botón volver */
.mapback{position:absolute;left:.6em;top:.6em;z-index:2}
#map .stand,#map .poi{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0)*22ms);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#map.noanim .stand,#map.noanim .poi{animation:none}

/* carga */
.loader{position:absolute;inset:0;z-index:70;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;font-size:clamp(11px,2.35cqw,32px)}
.loader img.lx{width:5em;height:auto;animation:lx 1.2s cubic-bezier(.5,0,.2,1) both}
@keyframes lx{0%{transform:rotate(-90deg) scale(.4);opacity:0}60%{transform:rotate(15deg) scale(1.08);opacity:1}100%{transform:rotate(0) scale(1)}}
.loader p{margin:0;font-weight:800;color:var(--muted)}
.bar{width:12em;height:.5em;border-radius:999px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--celeste),var(--menta),var(--amarillo));border-radius:999px;animation:fill 1.1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
.attract video.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Pantalla horizontal (notebook, TV acostada, celu girado) =====
   Se activa sola cuando la pantalla es más ancha que alta. La versión vertical no cambia. */
@media (min-aspect-ratio: 1/1){
  .app{aspect-ratio:auto;width:100%;max-width:none}
  .shell,.attract,.modal,.loader{font-size:clamp(11px,min(2.15cqh,1.3cqw),30px)}

  /* barra superior en una sola fila */
  .shell{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:1.1em;align-items:center}
  .top{display:contents}
  .brand{grid-column:1;grid-row:1;padding-block:.7em}
  .toolbar{grid-column:2;grid-row:1;padding-bottom:0}
  .clock{grid-column:3;grid-row:1}
  .view{grid-column:1/-1;grid-row:2;align-self:stretch;min-height:0}

  /* bienvenida: dos columnas sobre el video horizontal */
  .a-top{max-width:none}
  .a-main{display:grid;grid-template-columns:auto auto;column-gap:3.5em;row-gap:.8em;max-width:none;align-content:center;justify-content:center;align-items:center}
  .a-logo{grid-column:1;grid-row:1;justify-self:center}
  .lema{grid-column:1;grid-row:2;justify-self:center}
  .a-pills{grid-column:1;grid-row:3}
  .a-sub{grid-column:1;grid-row:4;max-width:22em;justify-self:center}
  .touch{grid-column:2;grid-row:1/3;align-self:end;justify-self:center}
  .a-langs{grid-column:2;grid-row:3/5;align-self:start;width:19em;margin-top:0}
  .a-foot{max-width:48em}

  /* inicio: video y en vivo a la izquierda, 6 botones en 3 por fila */
  #homeIn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:.9em}
  #homeIn>.dhero{grid-column:1;grid-row:1;height:auto;min-height:11em;margin-bottom:.6em}
  #homeIn>.livecard{grid-column:1;grid-row:2;align-self:end}
  #homeIn>.dgrid3{grid-column:2;grid-row:1/3;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(10em,1fr)}
  .dtile{min-height:0}

  /* locales: 4 columnas que llenan la pantalla */
  #listIn{display:flex;flex-direction:column}
  .cgrid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(8.5em,1fr);flex:1 0 auto}
  .ctile{min-height:0}
  .list1{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cbanner{height:20cqh}

  /* agenda: lista en 2 columnas */
  .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em .7em;align-content:start}

  /* plano: mapa a la izquierda, panel y ficha a la derecha */
  #vMap{flex-direction:row;gap:.9em}
  #vMap .mapwrap{margin:0 0 max(.9em,env(safe-area-inset-bottom,0px))}
  #vMap .panel{flex:0 0 min(40%,30em);padding-top:0}
  .hero{height:16cqh}
}
/* pantallas horizontales muy bajitas (celu girado) */
@media (min-aspect-ratio: 1/1) and (max-height: 500px){
  .a-logo{width:min(100%,11em)}
  .lema{font-size:2.6em}
}
/* arreglo: tocar el mini plano del botón "Plano y cómo llegar" abre el plano (antes el toque quedaba en un stand del dibujo y no pasaba nada) */
.mapmini{pointer-events:none}

/* ===== v4 (28/10): letra más grande, barra de navegación abajo, páginas que llenan la pantalla ===== */
.shell,.attract,.modal,.loader{font-size:clamp(13.5px,2.82cqw,38px)}
.vhead .back,.mapback{display:none!important}
.vhead{padding:.15em 0 .6em}
.vhead h2{font-size:1.75em}
.vhead small{font-size:.5em}

/* barra inferior: Volver + Inicio */
.bnav{flex:0 0 auto;display:flex;gap:.6em;padding-block:.55em max(.75em,env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;align-items:center;justify-content:center;gap:.5em;border-radius:999px;font-weight:900;font-size:1.12em;padding:.7em 1em;min-height:3.2em;box-sizing:border-box}
.bnav .bback{flex:1.7;background:var(--celeste);color:var(--ink);border:2px solid var(--ink);box-shadow:0 .22em 0 var(--ink);margin-bottom:.22em;transition:transform .12s ease,box-shadow .12s ease}
.bnav .bback:active{transform:translateY(.2em)!important;box-shadow:0 .02em 0 var(--ink)}
.bnav .bback svg{transform:rotate(180deg)}
.bnav .bhome{flex:1;background:var(--surface2);color:var(--fg);border:1px solid var(--line);margin-bottom:.22em}
.bnav svg.i{width:1.3em;height:1.3em;stroke-width:2.2}

/* páginas que ocupan toda la pantalla */
.fill{display:flex;flex-direction:column;min-height:100%;box-sizing:border-box}
.dtile{min-height:max(9.5em,17cqh)}
.lgrid{flex:1 1 auto;grid-auto-rows:minmax(7.2em,1fr);gap:.75em .65em}
.lgrid .dtile{min-height:0}
.lgrid>:last-child:nth-child(odd),.list1>:last-child:nth-child(odd){grid-column:1/-1}

/* rubro: la ilustración crece y llena lo que sobra */
.rub .cbanner{flex:1 1 13cqh;height:auto;min-height:11cqh;margin-bottom:.7em}
.list1{gap:.6em}
.list1 .fcard{padding:.5em;gap:.75em}
.list1 .fcard img,.list1 .fcard .ico{width:3.9em;height:3.9em}
.list1 .fcard b{font-size:1.08em}
.list1 .fcard small{font-size:.78em;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list1 .scard .bd{min-height:3.2em}
.list1 .scard .bd b{font-size:1.1em}
.list1 .scard .bd img,.list1 .scard .bd .ico{width:2.7em;height:2.7em}

/* agenda: filas grandes que llenan la pantalla */
.agfill .rows{flex:1 1 auto;display:grid;grid-auto-rows:minmax(4.4em,1fr);gap:.55em;padding-bottom:.3em}
.agfill .row{padding:.7em 1em;gap:.9em;grid-template-columns:4.2em minmax(0,1fr) auto}
.agfill .row .t{font-size:1.25em}
.agfill .row b{font-size:1.12em}
.agfill .row small{font-size:.85em}
.agfill .badge{font-size:.72em}
.agfill .seg button{font-size:.92em;padding:.7em .4em}
.agfill .days button{font-size:.95em;padding:.6em}
.agfill .note{font-size:.78em}

/* entradas */
.tixgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7em .65em}
.tcard{border-radius:1.1em;border:2px solid var(--ink);box-shadow:0 .28em 0 var(--ink);background:var(--c);color:var(--ink);padding:.8em .95em;display:flex;flex-direction:column;gap:.3em;min-width:0;margin-bottom:.28em}
.tcard.wide{grid-column:1/-1}
.tcard .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:.6em}
.tcard:not(.wide) .tt{flex-direction:column;gap:.45em}
.tcard .tn{font-family:var(--f-head);font-weight:400;font-size:1.45em;line-height:1}
.tcard .td{font-weight:800;font-size:.85em;opacity:.85}
.tcard .pr{font-family:var(--f-cond);font-weight:900;font-size:1.25em;letter-spacing:.06em;white-space:nowrap;line-height:1}
.tcard .pr i{font-style:normal;opacity:.25}
.tcard ul{list-style:none;margin:.35em 0 0;padding:.55em 0 0;border-top:1.5px dashed rgba(6,43,28,.35);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35em .9em}
.tcard li{display:flex;gap:.45em;align-items:center;font-weight:800;font-size:.85em;min-width:0}
.tcard li img{width:1em;height:auto;flex:0 0 auto;filter:brightness(0);opacity:.7}
.prnote{display:flex;align-items:center;gap:.5em;font-size:.78em;color:var(--muted);font-weight:700;margin:.2em 0 0}
.days2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65em}
.dcard{background:var(--surface);border:1px solid var(--line);border-top:.35em solid var(--c);border-radius:1.1em;padding:.75em .9em;display:flex;flex-direction:column;gap:.45em;min-width:0}
.dcard h3{font-family:var(--f-head);font-weight:400;font-size:1.4em;line-height:1;margin:0}
.dcard .k2{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.68em;color:var(--muted);margin-top:.25em}
.dcard .dl{display:flex;gap:.6em;font-size:.92em;font-weight:800;align-items:baseline;min-width:0}
.dcard .dl span{font-family:var(--f-cond);color:var(--celeste);flex:0 0 2.9em}
.dcard .hl{background:var(--surface2);border-radius:.8em;padding:.5em .65em;font-size:.86em;font-weight:700;line-height:1.3}
.dcard .hl span{display:block;font-family:var(--f-cond);color:var(--amarillo);font-weight:800;font-size:.85em}
.tixpage .incl span{font-size:.82em}

/* sponsors */
.spgrid{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(6em,1fr) minmax(9em,1.7fr) minmax(5.5em,1fr) minmax(5.5em,1fr);gap:.65em}
.sbig{border-radius:1.2em;padding:.95em 1.05em;display:flex;flex-direction:column;justify-content:space-between;gap:.5em;min-width:0;text-align:left;border:2px solid var(--ink);box-shadow:0 .28em 0 var(--ink);margin-bottom:.28em;color:var(--ink)}
.sbig .lv{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.72em}
.sbig .nm{font-family:var(--f-head);font-weight:400;font-size:2em;line-height:1;overflow-wrap:anywhere}
.sbig small{font-weight:800;font-size:.85em}
.sbig .go2{align-self:flex-start;display:inline-flex;gap:.4em;align-items:center;background:var(--ink);color:var(--blanco);border-radius:999px;padding:.5em .95em;font-weight:900;font-size:.85em}
.sbig .go2 svg{width:1.1em;height:1.1em}
.sbig.main{grid-column:1/-1;border:2px dashed var(--amarillo);box-shadow:none;color:var(--fg);background:transparent}
.sbig.main .lv{color:var(--amarillo)}
.sbig.oro{background:var(--amarillo)}
.sbig.plata{background:#E8F5D0}
.sbig.media{background:var(--surface);border-color:var(--line);box-shadow:none;color:var(--fg)}
.sbig.media .nm{font-size:1.5em}
.sbig.media .lv{color:var(--celeste)}

@media (max-aspect-ratio: 1/1){
  #homeIn{display:flex;flex-direction:column}
  #homeIn>.dgrid3{flex:1 1 auto;grid-auto-rows:minmax(9.5em,1fr)}
  #homeIn>.dgrid3 .dtile{min-height:0}
}
@media (max-width:520px){#qrBtn span{display:none}#qrBtn{padding:.38em .55em}}
@media (min-aspect-ratio: 1/1){
  .shell,.attract,.modal,.loader{font-size:clamp(13.5px,min(2.58cqh,1.56cqw),36px)}
  .shell{grid-template-rows:auto minmax(0,1fr) auto}
  .bnav{grid-column:1/-1;grid-row:3;padding-block:.45em max(.6em,env(safe-area-inset-bottom,0px))}
  .bnav button{min-height:2.8em;padding:.55em 1em}
  .bnav{justify-content:center}.bnav .bback{flex:0 1 22em}.bnav .bhome{flex:0 1 13em}
  #homeIn>.dgrid3{grid-auto-rows:minmax(8em,1fr)}
  .lgrid{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(7em,1fr)}
  .list1{grid-template-columns:repeat(var(--lc,4),minmax(0,1fr))}
  .list1>:last-child:nth-child(odd){grid-column:auto}
  .rub .cbanner{min-height:14cqh}
  .agfill .rows{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(3.8em,1fr)}
  .agfill .rows>:last-child:nth-child(odd){grid-column:1/-1}
  .tixpage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:1.1em;align-items:start}
  .tixpage>.vhead{grid-column:1/-1}
  .spgrid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(4em,1fr) minmax(5.5em,1.5fr) minmax(4em,1fr)}
  .sbig{padding:.7em .9em;gap:.3em}.sbig .nm{font-size:1.7em}.sbig.media .nm{font-size:1.3em}
  .sbig.oro,.sbig.plata{grid-column:span 2}
}


/* ===== v5 (28/10): plano grande con buscador, categorías, zoom y tira chica ===== */
#vMap{position:relative}
#vMap .panel,.spstrip{display:none!important}
#map{touch-action:none;cursor:grab}
#map .poi{transition:opacity .3s}
#map .poi.dim{opacity:.2}
.where{top:.6em;bottom:auto}
.mapwrap.picking .mstrip,.mapwrap.picking .mzoom{display:none}

/* buscador */
.msearch{position:relative;z-index:6;display:flex;flex-direction:column;gap:.45em;padding-bottom:.5em;flex:0 0 auto;min-width:0}
.msrow{display:flex;align-items:center;gap:.5em;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.15em .35em .15em .9em}
.msrow:focus-within{border-color:var(--celeste)}
.msrow>svg{color:var(--muted)}
.msrow input{flex:1;min-width:0;font:inherit;font-size:1em;font-weight:700;background:none;border:0;color:var(--fg);padding:.6em 0;outline:none}
.msrow input::placeholder{color:var(--muted);font-weight:600}
.msrow input::-webkit-search-cancel-button{display:none}
.msrow .x2{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:0 0 auto}
.msearch .chips .chip{font-size:.85em;padding:.45em .9em}
.mres{position:absolute;left:0;right:0;top:100%;max-height:36cqh;overflow-y:auto;overscroll-behavior:contain;background:var(--noche2);border:1px solid var(--line);border-radius:1em;padding:.5em;box-shadow:0 1em 2em rgba(0,0,0,.45);display:flex;flex-direction:column;gap:.35em}
.mres .pitem{font-size:.95em}
.mres .pitem>span:last-child{min-width:0}
.mres .pitem small{display:block;font-size:.75em;color:var(--muted);font-weight:700}
.mres .empty{padding:.5em .6em;margin:0}

/* zoom */
.mzoom{position:absolute;right:.6em;top:.6em;z-index:3;display:flex;flex-direction:column;gap:.4em}
.mzoom button{width:2.6em;height:2.6em;border-radius:.8em;background:rgba(10,86,56,.94);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.mzoom svg.i{width:1.25em;height:1.25em;stroke-width:2.2}

/* tira chica del lugar elegido */
.mstrip{position:absolute;left:.5em;right:.5em;bottom:.5em;z-index:4;display:flex;align-items:center;gap:.7em;background:var(--noche2);border:2px solid var(--amarillo);border-radius:1em;padding:.5em .55em;animation:rise .3s ease both;box-shadow:0 .6em 1.4em rgba(0,0,0,.4)}
.mth{width:3.1em;height:3.1em;border-radius:.7em;overflow:hidden;flex:0 0 auto;background:var(--c);display:grid;place-items:center;color:var(--ink)}
.mth img{width:100%;height:100%;object-fit:cover;display:block}
.mtx{min-width:0;flex:1;display:flex;flex-direction:column;gap:.12em}
.mtx small{font-family:var(--f-cond);font-weight:800;font-size:.66em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:.5em;align-items:center;white-space:nowrap;overflow:hidden}
.mtx small .demo{font-size:.85em;padding:.15em .5em}
.mtx b{font-family:var(--f-head);font-weight:400;font-size:1.15em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtx .mm{font-weight:800;font-size:.8em;color:var(--amarillo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{width:2.4em;height:2.4em;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}

/* "Ver en el plano" en cada tarjeta */
.seemap{display:inline-flex;align-items:center;gap:.3em;font-weight:900;font-size:.72em;white-space:nowrap}
.seemap svg.i{width:1.1em;height:1.1em}
.scard .seemap{margin:0 .3em .35em;align-self:flex-start;background:var(--ink);color:var(--blanco);border-radius:999px;padding:.25em .7em}
.fcard .seemap{color:var(--celeste);margin-top:.3em}

@media (min-aspect-ratio: 1/1){
  #vMap .msearch{order:2;flex:0 0 min(30%,23em);padding-bottom:max(.9em,env(safe-area-inset-bottom,0px));min-height:0}
  #vMap .msearch .chips{flex-wrap:wrap;overflow:visible}
  #vMap .mres{position:static;flex:1 1 auto;max-height:none;min-height:0;box-shadow:none}
}

/* ===== v6: "Estás en" abajo, ruta siempre a la vista ===== */
.where{top:auto;bottom:.6em}
.mfrom{display:flex;align-items:center;gap:.35em;font-size:.78em;font-weight:800;color:var(--fg);margin-top:.15em;text-align:left;min-width:0;max-width:100%}
.mfrom svg.i{width:1.1em;height:1.1em;color:var(--amarillo);flex:0 0 auto}
.mfrom span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfrom u{text-decoration:none;background:var(--amarillo);color:var(--ink);border-radius:999px;padding:.1em .6em;flex:0 0 auto;font-weight:900}

/* ===== v7: resultados en una fila abajo, el plano siempre a la vista ===== */
.mrow{position:absolute;left:.5em;right:.5em;bottom:.5em;z-index:4;display:flex;gap:.45em;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none;padding:.1em 0 .15em;animation:rise .25s ease both}
.mrow::-webkit-scrollbar{display:none}
.mrow .pitem{flex:0 0 auto;max-width:72%;background:var(--noche2);border:2px solid var(--c);box-shadow:0 .4em 1em rgba(0,0,0,.4);padding:.45em .8em .45em .5em}
.mrow .pitem>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .pitem small{display:block;font-size:.72em;color:var(--muted);font-weight:700}
.mrow .empty{flex:0 0 auto;background:var(--noche2);border:1px solid var(--line);border-radius:999px;padding:.6em 1em;margin:0;color:var(--fg);font-weight:700}
@media (max-aspect-ratio: 1/1){#mres{display:none!important}}
@media (min-aspect-ratio: 1/1){.mrow{display:none!important}}

/* ===== v8: marcas protagonistas + ficha de cada lugar ===== */
.rub .cbanner{flex:0 0 auto!important;height:20cqh!important;min-height:0!important}
.blist{display:grid;grid-template-columns:minmax(0,1fr);gap:.6em;padding-bottom:.6em}
.bcard{display:flex;align-items:center;gap:.85em;text-align:left;background:var(--surface);border:2px solid var(--line);border-left:.45em solid var(--c);border-radius:1.1em;padding:.75em .85em;min-width:0;transition:transform .12s ease}
.bcard:active{transform:scale(.985)}
.bcard .bth{width:3.6em;height:3.6em;border-radius:.75em;overflow:hidden;flex:0 0 auto;background:var(--c);display:grid;place-items:center;color:var(--ink)}
.bcard .bth img{width:100%;height:100%;object-fit:cover;display:block}
.bcard.food .bth{width:5.2em;height:5.2em}
.bcard .btx{min-width:0;flex:1;display:flex;flex-direction:column;gap:.2em}
.bcard .bk{font-family:var(--f-cond);font-weight:800;font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.bcard .bk .no2{background:var(--c);color:var(--ink);border-radius:999px;padding:.1em .55em}
.bcard .bn{font-family:var(--f-head);font-weight:400;font-size:1.6em;line-height:1.02;overflow-wrap:anywhere}
.bcard .bd2{font-size:.82em;color:var(--muted);font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .brow{display:flex;gap:.45em;align-items:center;flex-wrap:wrap;margin-top:.15em}
.bcard .seemap{color:var(--celeste);font-size:.78em}
.bcard .more{flex:0 0 auto;width:2.2em;height:2.2em;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}
.lvl{font-family:var(--f-cond);font-weight:900;letter-spacing:.06em;color:var(--amarillo);white-space:nowrap}
.lvl i{font-style:normal;opacity:.25}
.tagv{font-size:.68em;font-weight:900;letter-spacing:.04em;padding:.2em .6em;border-radius:999px;background:var(--menta);color:var(--ink);white-space:nowrap}
.tagv.tacc{background:var(--amarillo)}.tagv.vgn{background:var(--lima)}
/* ficha */
.place{display:flex;flex-direction:column;gap:.75em;padding-bottom:.6em}
.phero{position:relative;height:20cqh;border-radius:1.1em;overflow:hidden;border:2px solid var(--ink);background:var(--c);flex:0 0 auto}
.phero img,.phero video{width:100%;height:100%;object-fit:cover;display:block}
.phero .ico{width:100%;height:100%;border-radius:0;background:var(--c) var(--teximg) center/9em;background-blend-mode:luminosity;color:var(--ink)}
.phero .ico svg{width:4em;height:4em}
.pband{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.pband .no{min-width:2.1em;height:2.1em;padding:0 .4em;box-sizing:border-box;border-radius:999px;background:var(--c);color:var(--ink);display:grid;place-items:center;font-family:var(--f-head)}
.pband b{font-family:var(--f-cond);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8em;color:var(--muted)}
.pband .tg{font-size:.65em;font-weight:900;letter-spacing:.1em;padding:.25em .6em;border-radius:999px;background:var(--magenta);color:var(--blanco)}
.pband .tg.st{background:var(--amarillo);color:var(--ink)}
.pname{font-family:var(--f-head);font-weight:400;font-size:2.5em;line-height:1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pmeta{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.pmeta .lvl{font-size:1.3em}
.pmeta .tagv{font-size:.8em}
.pdesc{margin:0;font-size:1.02em;line-height:1.5;max-width:42em}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:1em;padding:.75em .9em;display:flex;flex-direction:column;gap:.3em}
.pbox .k2{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.7em;color:var(--muted)}
.pbox b{font-family:var(--f-head);font-weight:400;font-size:1.3em;line-height:1.1}
.pbox.hl{border-left:.35em solid var(--amarillo)}
.pbox.hl p{margin:0;font-weight:700;line-height:1.4}
.pitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45em}
.pitems span{background:var(--surface);border:1px solid var(--line);border-radius:.8em;padding:.55em .75em;font-weight:800;font-size:.9em;display:flex;gap:.5em;align-items:center;min-width:0}
.pitems span::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--c);flex:0 0 auto}
.pitems span:last-child:nth-child(odd){grid-column:1/-1}
.pgo{display:flex;align-items:center;justify-content:center;gap:.55em;width:100%;padding:.85em 1em;border-radius:1em;background:var(--amarillo);color:var(--ink);border:2px solid var(--ink);box-shadow:0 .25em 0 var(--ink);font-weight:900;font-size:1.1em;margin-top:.2em;margin-bottom:.25em}
.pgo svg.i{width:1.3em;height:1.3em;stroke-width:2.2}
.pgo small{font-weight:800;opacity:.75;font-size:.8em}
@media (min-aspect-ratio: 1/1){
  .rub .cbanner{height:22cqh!important}
  .blist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .blist>:last-child:nth-child(odd){grid-column:auto}
  .place{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);column-gap:1.2em;align-items:start}
  .place .phero{grid-column:1;grid-row:1/span 12;height:auto;aspect-ratio:1/1;max-height:62cqh}
  .place>*:not(.phero){grid-column:2}
  .pitems{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pitems span:last-child:nth-child(odd){grid-column:auto}

function brandMark(p,big){const b=p.brand;const nm=T(p.short||p.name);
  if(b&&b.lg)return `<span class="lgw${b.dk?' dk':''}"><img src="${b.lg}" alt="${esc(nm)}" loading="lazy"></span>`;
  const n=nm.length,fs=big?(n>22?1.5:n>14?2:2.6):(n>14?.62:n>8?.78:.95);

ipa da ExpoCannabis Brasil desde a primeira edição e distribui brindes no estande.","es":"A PITEIRA es una marca 100% brasileña fundada en 2015, con una propuesta pensada para quienes fuman. Participa de la ExpoCannabis Brasil desde la primera edición y reparte obsequios en su stand.","en":"A PITEIRA is a 100% Brazilian brand founded in 2015, with products aimed at smokers. It has taken part in ExpoCannabis Brasil since the first edition and hands out giveaways at its booth.","de":"A PITEIRA ist eine 100 % brasilianische Marke, 2015 gegründet, mit einem Angebot für Raucher. Seit der ersten Ausgabe ist sie auf der ExpoCannabis Brasil vertreten und verteilt am Stand Werbegeschenke."},"src":"oficial","ig":"a_piteira","off":"A Piteira"},"ABCAM":{"lg":"assets/logos/abcam-semiarido.webp","dk":0,"d":{"pt":"Com raízes no sertão, a ABCAM Semiárido atua no cuidado de pacientes que buscam na cannabis medicinal uma possibilidade terapêutica, unindo acolhimento, ciência, tecnologia e inovação.","es":"Con raíces en el sertão brasileño, ABCAM Semiárido acompaña a pacientes que buscan en el cannabis medicinal una posibilidad terapéutica, uniendo contención, ciencia, tecnología e innovación.","en":"Rooted in Brazil's sertão, ABCAM Semiárido supports patients who see medical cannabis as a therapeutic option, combining patient care, science, technology and innovation.","de":"Mit Wurzeln im brasilianischen Sertão begleitet ABCAM Semiárido Patientinnen und Patienten, die in medizinischem Cannabis eine Therapiemöglichkeit sehen – mit Zuwendung, Wissenschaft, Technologie und Innovation."},"src":"oficial","ig":"abcamsemiarido","off":"ABCAM Semiárido"},"ABCCI":{"lg":"assets/logos/abcci-associacao-brasileira-de-cannabis-e-canhamo-industrial.webp","dk":0,"d":{"pt":"Entidade dedicada à pesquisa, ao desenvolvimento tecnológico e à promoção da cultura da cannabis e do cânhamo industrial. Difunde conhecimento, incentiva o cultivo responsável dentro das normas e realiza cursos, oficinas e ações sociais, de redução de danos e de inclusão.","es":"Entidad dedicada a la investigación, el desarrollo tecnológico y la promoción de la cultura del cannabis y el cáñamo industrial. Difunde conocimiento, impulsa el cultivo responsable dentro de las normas y realiza cursos, talleres y acciones sociales, de reducción de daños e inclusión.","en":"Organization devoted to research, technological development and promoting the culture of cannabis and industrial hemp. It shares knowledge, encourages responsible cultivation within the rules and runs courses, workshops and social, harm-reduction and inclusion initiatives.","de":"Verband für Forschung, technologische Entwicklung und Förderung der Kultur von Cannabis und Industriehanf. Er vermittelt Wissen, fördert verantwortungsvollen Anbau im gesetzlichen Rahmen und bietet Kurse, Workshops sowie Sozial-, Schadensminderungs- und Inklusionsprojekte."},"src":"oficial","ig":"abccioficial","off":"ABCCI - Associação Brasileira de Cannabis e Cânhamo Industrial"},"ABF Genetics":{"lg":"assets/logos/abf-genetics.webp","dk":0,"d":{"pt":"Fundada em 2010 em Oakland, Califórnia, a ABF Genetics é uma casa de genética focada em melhoramento de precisão. Seleciona variedades por sabor, potência, vigor e consistência, com distribuição internacional. É sua terceira vez no Brasil.","es":"Fundada en 2010 en Oakland, California, ABF Genetics es una casa de genética enfocada en el mejoramiento de precisión. Selecciona variedades por sabor, potencia, vigor y consistencia, con distribución internacional. Es su tercera vez en Brasil.","en":"Founded in 2010 in Oakland, California, ABF Genetics is a genetics house focused on precision breeding. It selects strains for flavor, potency, vigor and consistency, with international distribution. This is its third time in Brazil.","de":"ABF Genetics, 2010 in Oakland, Kalifornien, gegründet, ist ein Genetik-Haus mit Fokus auf Präzisionszüchtung. Sorten werden nach Geschmack, Potenz, Wuchskraft und Konstanz ausgewählt und international vertrieben. Dritte Teilnahme in Brasilien."},"src":"oficial","ig":"abfgenetics","off":"ABF Genetics"},"ABRACE":{"lg":"assets/logos/abrace-esperanca.webp","dk":0,"d":{"pt":"A Abrace Esperança é uma associação pioneira de cannabis medicinal no Brasil, com mais de 60 mil pacientes. Atua com autorização desde 2017, com produção acompanhada pelas normas da Anvisa, e trabalha para ampliar o acesso ao tratamento.","es":"Abrace Esperança es una asociación pionera de cannabis medicinal en Brasil, con más de 60 mil pacientes. Opera con autorización desde 2017, con producción supervisada según las normas de Anvisa, y trabaja para ampliar el acceso al tratamiento.","en":"Abrace Esperança is a pioneering medical cannabis association in Brazil with over 60,000 patients. Authorized since 2017, with production following Anvisa standards, it works to expand access to treatment.","de":"Abrace Esperança ist ein Pionierverein für medizinisches Cannabis in Brasilien mit über 60.000 Patienten. Seit 2017 zugelassen, mit Produktion nach den Vorgaben der Anvisa, setzt sich der Verein für einen besseren Zugang zur Behandlung ein."},"src":"oficial","web":"https://abraceesperanca.com.br","ig":"abraceesperanca","off":"Abrace Esperança"},"Ace Rolling":{"lg":"assets/logos/ace-rolling.webp","dk":0,"d":{"pt":"A Ace Rolling fornece papéis para enrolar: livretos, cones pré-enrolados e wraps de cânhamo em diferentes materiais, sabores e cores. Também oferece personalização e venda no atacado.","es":"Ace Rolling provee papeles para armar: librillos, conos pre-armados y wraps de cáñamo en distintos materiales, sabores y colores. También ofrece personalización y venta mayorista.","en":"Ace Rolling supplies rolling papers: booklets, pre-rolled cones and hemp wraps in various materials, flavors and colors. It also offers customization and wholesale.","de":"Ace Rolling liefert Blättchen zum Drehen: Heftchen, vorgerollte Cones und Hanf-Wraps in verschiedenen Materialien, Geschmacksrichtungen und Farben. Dazu kommen Personalisierung und Großhandel."},"src":"oficial","ig":"acerolling.official","off":"Ace Rolling"},"Advanced Nutrients":{"lg":"assets/logos/advanced-nutrients.webp","dk":0,"d":{"pt":"Sistema de fertilizantes e bioestimulantes para cultivo de cannabis, desenvolvido com mais de duas décadas de pesquisa, para todas as fases da planta, da semente à colheita. Usado por produtores em mais de 128 países.","es":"Sistema de fertilizantes y bioestimulantes para cultivo de cannabis, desarrollado con más de dos décadas de investigación, para todas las fases de la planta, de la semilla a la cosecha. Lo usan productores de más de 128 países.","en":"Fertilizer and biostimulant system for cannabis cultivation, backed by more than two decades of research and covering every stage of the plant, from seed to harvest. Used by growers in more than 128 countries.","de":"Dünger- und Biostimulanzien-System für den Cannabisanbau, gestützt auf über zwei Jahrzehnte Forschung, für alle Phasen der Pflanze vom Samen bis zur Ernte. Wird von Anbauern in mehr als 128 Ländern genutzt."},"src":"oficial","web":"https://www.advancednutrients.com","ig":"advancednutrientsbrasil","off":"Advanced Nutrients"},"Amado & Amado Jr":{"d":{"pt":"Expositor do Pavilhão Cultural. Passe no estande para conhecer a marca.","es":"Expositor del Pabellón Cultural. Pasá por el stand para conocer la marca.","en":"Exhibitor in the Cultural Pavilion. Stop by the stand to discover the brand.","de":"Aussteller im Kulturpavillon. Besuchen Sie den Stand, um die Marke kennenzulernen."},"src":"gen"},"APMC":{"lg":"assets/logos/apmc.webp","dk":0,"d":{"pt":"A APMC (Associação Pan-Americana Multidisciplinar de Endocanabinologia) é uma entidade científica sem fins lucrativos criada em 2020 na Faculdade de Medicina do ABC. Reúne mais de 280 profissionais de saúde e promove educação e pesquisa em endocanabinologia.","es":"La APMC es una entidad científica sin fines de lucro dedicada a la endocannabinología, creada en 2020 en la Facultad de Medicina del ABC (FMABC), en Santo André. Reúne a más de 280 profesionales de la salud y promueve la educación y la investigación científica.","en":"APMC is a non-profit scientific association dedicated to endocannabinology, founded in 2020 at the ABC School of Medicine (FMABC) in Santo André. It brings together over 280 health professionals and promotes scientific education and research.","de":"Die APMC ist eine gemeinnützige wissenschaftliche Vereinigung für Endocannabinologie, 2020 an der Medizinischen Fakultät ABC (FMABC) in Santo André gegründet. Sie vereint über 280 Gesundheitsfachleute und fördert wissenschaftliche Bildung und Forschung."},"src":"oficial","off":"APMC"},"Aptus Plant":{"lg":"assets/logos/aptus.webp","dk":0,"d":{"pt":"A Aptus Plant Tech fabrica bioestimulantes que atuam no solo e nas plantas. Oferece nutrientes e bioestimulantes naturais e concentrados para melhorar a saúde e o rendimento das culturas desde o início.","es":"Aptus Plant Tech fabrica bioestimulantes que actúan sobre el suelo y las plantas. Ofrece nutrientes y bioestimulantes naturales y concentrados para mejorar la salud y el rendimiento de los cultivos desde el inicio.","en":"Aptus Plant Tech makes biostimulants that work on both soil and plants. It offers natural, concentrated nutrients and biostimulants to improve crop health and yield from the start.","de":"Aptus Plant Tech stellt Biostimulanzien her, die auf Boden und Pflanze wirken. Das Sortiment umfasst natürliche, konzentrierte Nährstoffe und Biostimulanzien für gesündere und ertragreichere Kulturen von Anfang an."},"src":"oficial","ig":"aptusholland","off":"Aptus"},"Assoc. Santo Amor":{"lg":"assets/logos/associacao-santo-amor.webp","dk":0,"d":{"pt":"A Santo Amor é uma associação dedicada ao acolhimento, cuidado, pesquisa, educação e acesso responsável à cannabis para fins terapêuticos. Dispensa fitoterápicos de cannabis aos associados mediante prescrição médica ou termo de uso terapêutico.","es":"Santo Amor es una asociación dedicada a la contención, el cuidado, la investigación, la educación y el acceso responsable al cannabis con fines terapéuticos. Dispensa fitoterápicos de cannabis a sus socios con receta médica o declaración de uso terapéutico.","en":"Santo Amor is an association devoted to support, care, research, education and responsible access to cannabis for therapeutic use. It dispenses cannabis herbal products to members with a medical prescription or a therapeutic-use declaration.","de":"Santo Amor ist ein Verein für Begleitung, Betreuung, Forschung, Bildung und verantwortungsvollen Zugang zu Cannabis für therapeutische Zwecke. Er gibt Cannabis-Phytotherapeutika an Mitglieder ab – mit ärztlicher Verschreibung oder Erklärung zum therapeutischen Gebrauch."},"src":"oficial","ig":"santoamorbr","off":"Associação Santo Amor"},"Assoc. VivaCannabis":{"lg":"assets/logos/associacao-viva-cannabis.webp","dk":0,"d":{"pt":"A Associação Viva Cannabis promove o acesso seguro, humanizado e responsável à cannabis medicinal no Brasil. Acolhe, orienta e apoia pacientes e familiares e realiza ações sociais, educativas e de conscientização.","es":"La Associação Viva Cannabis promueve el acceso seguro, humanizado y responsable al cannabis medicinal en Brasil. Recibe, orienta y apoya a pacientes y familias, y realiza acciones sociales, educativas y de concientización.","en":"Associação Viva Cannabis promotes safe, humane and responsible access to medical cannabis in Brazil. It welcomes, guides and supports patients and families, and runs social, educational and awareness initiatives.","de":"Die Associação Viva Cannabis setzt sich für einen sicheren, menschlichen und verantwortungsvollen Zugang zu medizinischem Cannabis in Brasilien ein. Sie begleitet, berät und unterstützt Patienten und Angehörige und führt Sozial-, Bildungs- und Aufklärungsarbeit durch."},"src":"oficial","ig":"vivacannabisorg","off":"Associação Viva Cannabis"},"Atami":{"lg":"assets/logos/atami.webp","dk":1,"d":{"pt":"Marca de nutrição vegetal fundada em 1997, que desenvolve, produz e testa seus produtos de forma independente. No Brasil, o portfólio inclui B'CUZZ, linha de nutrição mineral, e BASTICS, aditivos concentrados para raízes, floração e finalização.","es":"Marca de nutrición vegetal fundada en 1997, que desarrolla, produce y prueba sus productos de forma independiente. En Brasil, su portafolio incluye B'CUZZ, línea de nutrición mineral, y BASTICS, aditivos concentrados para raíces, floración y finalización.","en":"Plant nutrition brand founded in 1997 that develops, produces and tests its products independently. In Brazil its portfolio includes B'CUZZ, a mineral nutrition line, and BASTICS, concentrated additives for roots, flowering and finishing.","de":"Marke für Pflanzenernährung, gegründet 1997, die ihre Produkte unabhängig entwickelt, herstellt und testet. In Brasilien umfasst das Sortiment B'CUZZ, eine mineralische Nährstofflinie, und BASTICS, konzentrierte Zusätze für Wurzeln, Blüte und Reifephase."},"src":"oficial","web":"https://www.atami.com","ig":"atami_brasil","off":"Atami"},"Austral":{"lg":"assets/logos/austral-botanicals.webp","dk":0,"d":{"pt":"Óleos e gomas de espectro completo, amplo espectro e isolados, formulados com matérias-primas produzidas no Uruguai. Cada formulação passa por análise laboratorial e certificação, com rastreabilidade dos produtos.","es":"Aceites y gomitas de espectro completo, amplio espectro e isolados, formulados con materias primas producidas en Uruguay. Cada formulación pasa por análisis de laboratorio y certificación, con trazabilidad de los productos.","en":"Full-spectrum, broad-spectrum and isolate oils and gummies, formulated with raw materials produced in Uruguay. Each formulation undergoes laboratory analysis and certification, with full product traceability.","de":"Öle und Fruchtgummis als Vollspektrum, Breitspektrum und Isolat, hergestellt aus Rohstoffen aus Uruguay. Jede Formulierung wird im Labor a icinal (associações de pacientes, saúde, ciência e direito). Passe no estande para conhecer a marca.","es":"Expositor del sector Cannabis é Medicinal (asociaciones de pacientes, salud, ciencia y derecho). Pasá por el stand para conocer la marca.","en":"Exhibitor in the Cannabis é Medicinal area (patient associations, health, science and law). Stop by the stand to discover the brand.","de":"Aussteller im Bereich Cannabis é Medicinal (Patientenverbände, Medizin, Wissenschaft und Recht). Besuchen Sie den Stand, um die Marke kennenzulernen."},"src":"gen"},"Biobizz":{"lg":"assets/logos/biobizz.webp","dk":0,"d":{"pt":"Fundada em 1992, com raízes na Holanda e sede em Bilbao (Espanha), a Biobizz produz fertilizantes e aditivos orgânicos para agricultura e horticultura. Seus produtos usam ingredientes naturais e são certificados para agricultura orgânica.","es":"Fundada en 1992, con raíces en Holanda y sede en Bilbao (España), Biobizz produce fertilizantes y aditivos orgánicos para agricultura y horticultura. Sus productos usan ingredientes naturales y están certificados para agricultura orgánica.","en":"Founded in 1992, with roots in the Netherlands and headquarters in Bilbao, Spain, Biobizz makes organic fertilizers and additives for agriculture and horticulture. Its products use natural ingredients and are certified for organic farming.","de":"Biobizz wurde 1992 gegründet, hat Wurzeln in den Niederlanden und Sitz in Bilbao (Spanien). Das Unternehmen stellt organische Dünger und Zusätze für Landwirtschaft und Gartenbau her – aus natürlichen Zutaten und für den ökologischen Landbau zertifiziert."},"src":"oficial","web":"https://www.biobizz.com","ig":"biobizzwwo","off":"Biobizz"},"Blind Beez":{"lg":"assets/logos/blindbeez.webp","dk":0,"d":{"pt":"A BlindBeez Massoterapia promove inclusão e bem-estar, gerando oportunidades para profissionais com deficiência visual por meio da massoterapia.","es":"BlindBeez Massoterapia promueve la inclusión y el bienestar, generando oportunidades para profesionales con discapacidad visual a través de la masoterapia.","en":"BlindBeez Massoterapia promotes inclusion and well-being by creating opportunities for visually impaired professionals through massage therapy.","de":"BlindBeez Massoterapia fördert Inklusion und Wohlbefinden und schafft durch Massagetherapie Chancen für sehbehinderte Fachkräfte."},"src":"oficial","ig":"blindbeez","off":"BlindBeez"},"BlueLab":{"lg":"assets/logos/bluelab-rma.webp","dk":0,"d":{"pt":"A Bluelab produz dispositivos de medição e automação para hidroponia e cultivo em ambiente controlado. Seus equipamentos são usados por produtores em todo o mundo, de pequenas salas de cultivo a instalações comerciais.","es":"Bluelab fabrica dispositivos de medición y automatización para hidroponía y cultivo en ambiente controlado. Sus equipos los usan productores de todo el mundo, desde pequeños cuartos de cultivo hasta instalaciones comerciales.","en":"Bluelab makes measurement and automation devices for hydroponics and controlled-environment growing. Its equipment is used by growers worldwide, from small grow rooms to commercial facilities.","de":"Bluelab stellt Mess- und Automatisierungsgeräte für Hydrokultur und Anbau in kontrollierter Umgebung her. Die Geräte werden weltweit genutzt, vom kleinen Growroom bis zur kommerziellen Anlage."},"src":"oficial","web":"https://bluelab.com","ig":"bluelab_official","off":"BlueLab"},"Blunt Rey":{"lg":"assets/logos/blunt-rey-2026.webp","dk":0,"d":{"pt":"A Blunt Rey é uma marca argentina com mais de 10 anos no mercado de produtos e acessórios para fumar: sedas, filtros, cones, bandejas, dichavadores, narguilés e cachimbos, entre outros. Atende consumidores, comerciantes e distribuidores.","es":"Blunt Rey es una marca argentina con más de 10 años en el mercado de productos y accesorios para fumar: papeles, filtros, conos, bandejas, picadores, narguiles y pipas, entre otros. Atiende a consumidores, comercios y distribuidores.","en":"Blunt Rey is an Argentine brand with over 10 years in smoking products and accessories: papers, filters, cones, trays, grinders, hookahs and pipes, among others. It serves consumers, retailers and distributors.","de":"Blunt Rey ist eine argentinische Marke mit über 10 Jahren Erfahrung bei Rauchprodukten und -zubehör: Papers, Filter, Cones, Trays, Grinder, Shishas und Pfeifen u. a. Sie beliefert Endkunden, Händler und Distributoren."},"src":"oficial","ig":"bluntreyargentina","off":"Blunt Rey"},"Bob Prensas":{"d":{"pt":"Expositor do setor Cannabis é Plural C (grandes marcas, sementes e cultivo). Passe no estande para conhecer a marca.","es":"Expositor del sector Cannabis é Plural C (grandes marcas, semillas y cultivo). Pasá por el stand para conocer la marca.","en":"Exhibitor in the Cannabis é Plural C area (big brands, seeds and grow). Stop by the stand to discover the brand.","de":"Aussteller im Bereich Cannabis é Plural C (große Marken, Samen und Anbau). Besuchen Sie den Stand, um die Marke kennenzulernen."},"src":"gen"},"Bombaco":{"lg":"assets/logos/bombaco.webp","dk":0,"d":{"pt":"A BOMBACO® é uma marca de tabaco orgânico criada em 2018. Desenvolve um tabaco que une qualidade e sustentabilidade e conecta uma comunidade de pessoas e marcas, com a arte como parte de sua identidade.","es":"BOMBACO® es una marca de tabaco orgánico creada en 2018. Desarrolla un tabaco que combina calidad y sustentabilidad, y conecta a una comunidad de personas y marcas, con el arte como parte de su identidad.","en":"BOMBACO® is an organic tobacco brand created in 2018. It develops tobacco that combines quality and sustainability and connects a community of people and brands, with art as part of its identity.","de":"BOMBACO® ist eine 2018 gegründete Marke für Bio-Tabak. Sie entwickelt Tabak, der Qualität und Nachhaltigkeit verbindet, und vernetzt eine Community aus Menschen und Marken; Kunst ist Teil ihrer Identität."},"src":"oficial","ig":"bom.baco","off":"Bombaco"},"BombFruit":{"lg":"assets/logos/bombfrui
