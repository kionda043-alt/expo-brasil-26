ts.","de":"Familienbetrieb, vor über 20 Jahren vom Japaner „Seu Paulo“ gegründet, heute in 3. Generation. Stellt gebackene Cocada (Kokos-Süßspeise) her, cremig und weich, mit mehr Kokos als Zucker und frischen Zutaten."},"src":"oficial","ig":"cremosacocada","off":"Cocada Cremosa"},"Cofen / Coren / Sobeca":{"d":{"pt":"Estande conjunto do Conselho Federal de Enfermagem (Cofen), dos Conselhos Regionais (Coren) e da Sociedade Brasileira de Enfermagem Canábica (Sobeca), entidade registrada pelo Cofen em 2026 que reúne a enfermagem dedicada à cannabis medicinal.","es":"Stand conjunto del Consejo Federal de Enfermería de Brasil (Cofen), los consejos regionales (Coren) y la Sociedad Brasileña de Enfermería Canábica (Sobeca), entidad registrada por el Cofen en 2026 que reúne a la enfermería dedicada al cannabis medicinal.","en":"Joint stand of Brazil's Federal Nursing Council (Cofen), the regional councils (Coren) and the Brazilian Society of Cannabis Nursing (Sobeca), registered with Cofen in 2026, which brings together nurses working with medical cannabis.","de":"Gemeinsamer Stand des brasilianischen Bundespflegerats (Cofen), der Regionalräte (Coren) und der Brasilianischen Gesellschaft für Cannabis-Pflege (Sobeca), 2026 beim Cofen registriert, die Pflegekräfte im Bereich medizinisches Cannabis vereint."},"src":"web","web":"https://www.cofen.gov.br/","ig":"cofen_oficial","off":"COFEN"},"Cold Core":{"lg":"assets/logos/cold-core-tech.webp","dk":0,"d":{"pt":"Indústria do Espírito Santo que desenvolve e fabrica equipamentos de extração, feitos integralmente em aço inox AISI 304, para laboratórios, associações, produtores e indústrias. Apresenta a linha COLD CORE HASH MACHINE, nos modelos Mini, Prime e Ultra.","es":"Industria de Espírito Santo (Brasil) que desarrolla y fabrica equipos de extracción, hechos íntegramente en acero inoxidable AISI 304, para laboratorios, asociaciones, productores e industrias. Presenta la línea COLD CORE HASH MACHINE: modelos Mini, Prime y Ultra.","en":"Manufacturer from Espírito Santo, Brazil, that designs and builds extraction equipment made entirely of AISI 304 stainless steel for labs, associations, growers and industry. It presents the COLD CORE HASH MACHINE line: Mini, Prime and Ultra.","de":"Hersteller aus Espírito Santo (Brasilien), der Extraktionsanlagen komplett aus Edelstahl AISI 304 entwickelt und baut – für Labore, Vereine, Produzenten und Industrie. Vorgestellt wird die Linie COLD CORE HASH MACHINE: Mini, Prime und Ultra."},"src":"oficial","ig":"coldcore_tech","off":"Cold Core Tech"},"Colméia BR":{"d":{"pt":"Expositor do Pavilhão Cultural, setor de cultura, acessórios e estilo de vida. Passe no estande para conhecer a marca e seus produtos.","es":"Expositor del Pabellón Cultural, sector de cultura, accesorios y estilo de vida. Pasá por el stand para conocer la marca y sus productos.","en":"Exhibitor in the Cultural Pavilion, the area for culture, accessories and lifestyle. Visit the stand to meet the brand and its products.","de":"Aussteller im Kulturpavillon, dem Bereich für Kultur, Zubehör und Lifestyle. Besuchen Sie den Stand, um die Marke und ihre Produkte kennenzulernen."},"src":"gen"},"Correa Adv. e Dra. Desirée":{"d":{"pt":"Estande compartilhado por um escritório de advocacia (Correa Adv.) e pela Dra. Desirée, no Pavilhão Cultural. Passe no estande para conhecer os serviços.","es":"Stand compartido por un estudio jurídico (Correa Adv.) y la Dra. Desirée, en el Pabellón Cultural. Pasá por el stand para conocer sus servicios.","en":"Stand shared by a law office (Correa Adv.) and Dra. Desirée, in the Cultural Pavilion. Visit the stand to learn about their services.","de":"Gemeinsamer Stand einer Anwaltskanzlei (Correa Adv.) und von Dra. Desirée im Kulturpavillon. Besuchen Sie den Stand, um die Leistungen kennenzulernen."},"src":"gen","off":"Correa Advocacia"},"Cultive / THSER":{"lg":"assets/logos/cultive.webp","dk":1,"d":{"pt":"A Cultive – Associação de Cannabis e Saúde reúne pacientes, fami de la Luna. Sus alquimias combinan saberes ancestrales, insumos agroecológicos y aromaterapia cannábica: velas, inciensos, perfumería botánica y adornos.","en":"DeLua brings together nature, magic and self-care, inspired by the cycles of life and the Moon. Its alchemies combine ancestral knowledge, agroecological ingredients and cannabis aromatherapy: candles, incense, botanical perfumery and adornments.","de":"DeLua verbindet Natur, Magie und Selbstfürsorge, inspiriert von den Zyklen des Lebens und des Mondes. Ihre Alchemien vereinen überliefertes Wissen, agrarökologische Rohstoffe und Cannabis-Aromatherapie: Kerzen, Räucherwerk, botanische Düfte und Schmuck."},"src":"oficial","ig":"deluaalquimias","off":"DeLua Alquimias"},"Delícias da Tia Ju":{"lg":"assets/logos/delicias-da-tia-ju.webp","dk":0,"d":{"pt":"Marca criada há 3 anos que trabalha com frutas frescas selecionadas cobertas com chocolate. Seu produto de destaque é o espeto de morango com chocolate.","es":"Marca creada hace 3 años que trabaja con frutas frescas seleccionadas cubiertas de chocolate. Su producto destacado es la brochette de frutillas con chocolate.","en":"Brand founded 3 years ago that works with fresh, selected fruit covered in chocolate. Its signature product is the chocolate-covered strawberry skewer.","de":"Vor 3 Jahren gegründete Marke, die frische, ausgewählte Früchte mit Schokoladenüberzug anbietet. Ihr Markenzeichen ist der Erdbeerspieß mit Schokolade."},"src":"oficial","ig":"delicias_da_tia_ju_oficial","off":"Delícias da tia Ju"},"DNA":{"d":{"pt":"Expositor do setor Cannabis é Plural, área de indústria e cultivo. Passe no estande para conhecer a marca e seus produtos.","es":"Expositor del sector Cannabis é Plural, área de industria y cultivo. Pasá por el stand para conocer la marca y sus productos.","en":"Exhibitor in the Cannabis é Plural sector, covering industry and growing. Visit the stand to see the brand and its products.","de":"Aussteller im Bereich Cannabis é Plural (Industrie und Anbau). Besuchen Sie den Stand, um die Marke und ihre Produkte kennenzulernen."},"src":"gen"},"Dr Green":{"lg":"assets/logos/dr-green.webp","dk":0,"d":{"pt":"A Doctor Green é um ecossistema de cannabis medicinal que conecta pacientes a profissionais, informação e soluções para tornar o acesso ao tratamento mais simples, seguro e acompanhado.","es":"Doctor Green es un ecosistema de cannabis medicinal que conecta a pacientes con profesionales, información y soluciones para que el acceso al tratamiento sea más simple, seguro y acompañado.","en":"Doctor Green is a medical cannabis ecosystem that connects patients with professionals, information and solutions to make access to treatment simpler, safer and supported.","de":"Doctor Green ist ein Ökosystem für medizinisches Cannabis, das Patienten mit Fachleuten, Informationen und Lösungen verbindet, um den Zugang zur Behandlung einfacher, sicherer und begleitet zu gestalten."},"src":"oficial","ig":"doctorgreen.ofc","off":"Dr Green"},"Dr Sativa":{"lg":"assets/logos/drsativa.webp","dk":1,"d":{"pt":"Dr. Sativa é um hub de cannabis medicinal que reúne comunidade, atendimento médico e tecnologia, com uma rede social de cannabis medicinal e análises clínicas feitas por sua inteligência artificial, o Salomao.","es":"Dr. Sativa es un hub de cannabis medicinal que reúne comunidad, atención médica y tecnología, con una red social de cannabis medicinal y análisis clínicos realizados por su inteligencia artificial, Salomao.","en":"Dr. Sativa is a medical cannabis hub combining community, medical care and technology, with a medical cannabis social network and clinical analyses by its artificial intelligence, Salomao.","de":"Dr. Sativa ist ein Hub für medizinisches Cannabis, der Community, ärztliche Betreuung und Technologie vereint – mit einem sozialen Netzwerk für medizinisches Cannabis und klinischen Analysen durch die eigene KI Salomao."},"src":"oficial","ig":"drsativa.br","off":"DrSativa"},"Dream Keepers":{"lg":"assets/logos/dreamkeepers.webp","dk":0,"d":{"pt":"Empresa especializada em produtos xamânicos, medicinas da floresta, fitoterapia indígena e artigos para práticas ancestrais: cacau cerimonial, chás, rapés, instrumentos nativos e outros elementos usados pelos povos originários.","es":"Empresa especializada en productos chamánicos, medicinas de la selva, fitoterapia indígena y artículos para prácticas ancestrales: cacao ceremonial, tés, rapé, instrumentos nativos y otros elementos usados por los pueblos originarios.","en":"Company specializing in shamanic products, forest medicines, Indigenous herbalism and items for ancestral practices: ceremonial cacao, teas, rapé snuff, native instruments and other elements used by Indigenous peoples.","de":"Unternehmen für schamanische Produkte, Waldmedizin, indigene Pflanzenheilkunde und Artikel für überlieferte Praktiken: zeremonieller Kakao, Tees, Rapé, traditionelle Instrumente und weitere Elemente indigener Völker."},"src":"oficial","ig":"dreamkeepersxamanismoo","off":"DreamKeepers"},"Drim":{"lg":"assets/logos/drim-auto-cuidado.webp","dk":0,"d":{"pt":"A Drim é uma marca de autocuidado inspirada na cultura canábica. Oferece produtos de aromaterapia, cosméticos e blends inspirados nos terpenos de diferentes strains, com ingredientes naturais, para diferentes momentos da rotina.","es":"Drim es una marca de autocuidado inspirada en la cultura cannábica. Ofrece productos de aromaterapia, cosméticos y blends inspirados en los terpenos de distintas cepas, con ingredientes naturales, para distintos momentos del día.","en":"Drim is a self-care brand inspired by cannabis culture. It offers aromatherapy products, cosmetics and blends inspired by the terpenes of different strains, made with natural ingredients for different moments of the day.","de":"Drim ist eine Selfcare-Marke, inspiriert von der Cannabiskultur. Angeboten werden Aromatherapie-Produkte, Kosmetik und Blends nach den Terpenen verschiedener Sorten, mit natürlichen Zutaten für verschiedene Momente des Alltags."},"src":"oficial","ig":"somosdrim","off":"Drim AutoCuidado"},"Dutch Passion":{"d":{"pt":"Banco de sementes de Amsterdã, na Holanda, ativo desde 1987. É conhecido por suas linhas de sementes feminizadas e automáticas e por genéticas clássicas como Blueberry, Orange Bud e Mazar.","es":"Banco de semillas de Ámsterdam, Países Bajos, activo desde 1987. Es conocido por sus líneas de semillas feminizadas y automáticas y por genéticas clásicas como Blueberry, Orange Bud y Mazar.","en":"Amsterdam-based seed bank from the Netherlands, active since 1987. Known for its feminized and autoflowering seed lines and classic genetics such as Blueberry, Orange Bud and Mazar.","de":"Samenbank aus Amsterdam (Niederlande), aktiv seit 1987. Bekannt für feminisierte und autoflowering Samenlinien sowie klassische Genetiken wie Blueberry, Orange Bud und Mazar."},"src":"web","web":"https://dutch-passion.com/"},"Easy Coco":{"lg":"assets/logos/easycoco-nutrientes.webp","dk":0,"d":{"pt":"Desde 2021, a EasyCoco produz nutrientes para cultivo em substratos inertes. O Kit EasyCoco, com fórmula A+B+C, oferece nutrição completa e pH estável em todas as fases da planta, com embalagens reutilizáveis.","es":"Desde 2021, EasyCoco produce nutrientes para cultivo en sustratos inertes. El Kit EasyCoco, con fórmula A+B+C, ofrece nutrición completa y pH estable en todas las etapas de la planta, con envases reutilizables.","en":"Since 2021, EasyCoco has made nutrients for growing in inert substrates. The EasyCoco Kit, with an A+B+C formula, provides complete nutrition and stable pH at every plant stage, in reusable packaging.","de":"Seit 2021 stellt EasyCoco Nährstoffe für den Anbau in inerten Substraten her. Das EasyCoco-Kit mit A+B+C-Formel liefert vollständige Nährstoffversorgung und stabilen pH-Wert in allen Pflanzenphasen, in wiederverwendbaren Verpackungen."},"src":"oficial","ig":"easycoco_nutrientes","off":"Easycoco Nutrientes"},"Embrapa / HempTech / Ficus":{"d":{"pt":"Embrapa, empresa pública brasileira de pesquisa agropecuária, e o Instituto Ficus, com a The Green Hub, lançaram em 2025 a iniciativa HempTech Brasil para impulsionar pesquisa, inovação e regulação do cânhamo e da cannabis no país.","es":"Embrapa, la empresa pública brasileña de investigación agropecuaria, y el Instituto Ficus, junto a The Green Hub, lanzaron en 2025 la iniciativa HempTech Brasil para impulsar la investigación, la innovación y la regulación del cáñamo y el cannabis en Brasil.","en":"Embrapa, Brazil's public agricultural research corporation, and Instituto Ficus, together with The Green Hub, launched the HempTech Brasil initiative in 2025 to advance hemp and cannabis research, innovation and regulation in Brazil.","de":"Embrapa, Brasiliens staatliche Agrarforschungsgesellschaft, und das Instituto Ficus starteten 2025 gemeinsam mit The Green Hub die Initiative HempTech Brasil, um Forschung, Innovation und Regulierung von Hanf und Cannabis in Brasilien voranzubringen."},"src":"web","web":"https://www.embrapa.br/","off":"Embrapa"},"Embrapa / INTA":{"d":{"pt":"Estande conjunto da Embrapa (Brasil) e do INTA (Argentina), institutos públicos de pesquisa agropecuária que vêm trocando conhecimentos sobre cultivo de cannabis medicinal e cânhamo industrial.","es":"Stand conjunto de Embrapa (Brasil) y el INTA (Argentina), institutos públicos de investigación agropecuaria que vienen intercambiando conocimientos sobre cultivo de cannabis medicinal y cáñamo industrial.","en":"Joint stand of Embrapa (Brazil) and INTA (Argentina), public agricultural research institutes that have been sharing knowledge on medical cannabis and industrial hemp cultivation.","de":"Gemeinsamer Stand von Embrapa (Brasilien) und INTA (Argentinien), staatlichen Agrarforschungsinstituten, die Wissen über den Anbau von medizinischem Cannabis und Industriehanf austauschen."},"src":"web","web":"https://www.embrapa.br/","off":"Embrapa"},"EsmatWear":{"lg":"assets/logos/esmatwear.webp","dk":1,"d":{"pt":"Produtos autorais desenvolvidos por um jovem refugiado do Afeganistão.","es":"Productos de autor desarrollados por un joven refugiado de Afganistán.","en":"Original products designed by a young refugee from Afghanistan.","de":"Eigene Produkte, entworfen von einem jungen Geflüchteten aus Afghanistan."},"src":"oficial","ig":"esmatwear","off":"Esmatwear"},"Expo Manas":{"lg":"assets/logos/expomanas.webp","dk":0,"d":{"pt":"A ExpoManas é uma plataforma de conexão, negócios e desenvolvimento que integra empreendedorismo feminino, cultura, educação, saúde integrativa e economia criativa ao ecossistema canábico e psicodélico, conectando marcas e profissionais de todo o Brasil.","es":"ExpoManas es una plataforma de conexión, negocios y desarrollo que integra emprendimiento femenino, cultura, educación, salud integrativa y economía creativa al ecosistema cannábico y psicodélico, conectando marcas y profesionales de todo Brasil.","en":"ExpoManas is a networking, business and development platform that brings women's entrepreneurship, culture, education, integrative health and the creative economy into the cannabis and psychedelic ecosystem, linking brands and professionals across Brazil.","de":"ExpoManas ist eine Plattform für Vernetzung, Business und Entwicklung, die weibliches Unternehmertum, Kultur, Bildung, integrative Gesundheit und Kreativwirtschaft ins Cannabis- und Psychedelika-Ökosystem einbindet und Marken und Fachleute aus ganz Brasilien verbindet."},"src":"oficial","ig":"expomanas","off":"Expomanas"},"FACT":{"d":{"pt":"Federação das Associações de Cannabis Terapêutica, que reúne associações de pacientes no Brasil. Atua na articulação do setor, em estudos sobre o funcionamento das associações e na promoção de boas práticas.","es":"Federación de Asociaciones de Cannabis Terapéutico de Brasil, que reúne asociaciones de pacientes. Trabaja en la articulación del sector, en estudios sobre el funcionamiento de las asociaciones y en la promoción de buenas prácticas.","en":"Federation of Therapeutic Cannabis Associations, bringing together patient associations in Brazil. It works on sector coordination, studies on how associations operate and the promotion of good practices.","de":"Föderation der Vereinigungen für therapeutisches Cannabis, die Patientenvereinigungen in Brasilien bündelt. Sie koordiniert den Sektor, untersucht die Arbeitsweise der Vereinigungen und fördert gute Praxis."},"src":"web","off":"Federação das Associações de Cannabis Terapêutica"},"Favorita Substratos":{"lg":"assets/logos/favorita-substratos.webp","dk":0,"d":{"pt":"A Favorita produz substratos especiais para o cultivo de flores e plantas, com matéria-prima importada, voltados a profissionais do paisagismo. São formulados para favorecer o enraizamento, a retenção de água e nutrientes e o desenvolvimento das plantas.","es":"Favorita produce sustratos especiales para el cultivo de flores y plantas, con materia prima importada, pensados para profesionales del paisajismo. Están formulados para favorecer el enraizamiento, la retención de agua y nutrientes y el desarrollo de las plantas.","en":"Favorita makes specialty substrates for growing flowers and plants, using imported raw materials and aimed at landscaping professionals. They are formulated to support rooting, water and nutrient retention and plant development.","de":"Favorita stellt Spezialsubstrate für den Anbau von Blumen und Pflanzen aus importierten Rohstoffen her, ausgerichtet auf Profis im Landschaftsbau. Sie sind auf Wurzelbildung, Wasser- und Nährstoffspeicherung und gesundes Pflanzenwachstum ausgelegt."},"src":"oficial","ig":"favoritasubstratos","off":"Favorita Substratos"},"FB Boodi":{"d":{"pt":"Expositor do Pavilhão Cultural da ExpoCannabis Brasil, setor dedicado a cultura, acessórios e estilo de vida. Passe no estande para conhecer a marca e seus produtos.","es":"Expositor del Pabellón Cultural de ExpoCannabis Brasil, sector dedicado a cultura, accesorios y estilo de vida. Pasá por el stand para conocer la marca y sus productos.","en":"Exhibitor in the Cultural Pavilion of ExpoCannabis Brasil, the area for culture, accessories and lifestyle. Stop by the stand to meet the brand and its products.","de":"Aussteller im Kulturpavillon der ExpoCannabis Brasil, dem Bereich für Kultur, Zubehör und Lifestyle. Am Stand lernst du die Marke und ihre Produkte kennen."},"src":"gen","off":"F B BOODTS"},"FCM Law":{"lg":"assets/logos/fcm-law.webp","dk":1,"d":{"pt":"Expositor do Pavilhão Cultural da ExpoCannabis Brasil, setor dedicado a cultura, acessórios e estilo de vida. Passe no estande para conhecer a marca e seus produtos.","es":"Expositor del Pabellón Cultural de ExpoCannabis Brasil, sector dedicado a cultura, accesorios y estilo de vida. Pasá por el stand para conocer la marca y sus productos.","en":"Exhibitor in the Cultural Pavilion of ExpoCannabis Brasil, the area for culture, accessories and lifestyle. Stop by the stand to meet the brand and its products.","de":"Aussteller im Kulturpavillon der ExpoCannabis Brasil, dem Bereich für Kultur, Zubehör und Lifestyle. Am Stand lernst du die Marke und ihre Produkte kennen."},"src":"gen","ig":"fcmlaw","off":"FCM Law"},"Feitiços Aromáticos":{"lg":"assets/logos/feiticos-aromaticos.webp","dk":0,"d":{"pt":"Indústria brasileira de cosméticos sensuais com mais de 20 anos e fábrica própria. Produz lubrificantes, géis excitantes, óleos de massagem, produtos beijáveis e outros itens de bem-estar íntimo, registrados na Anvisa, veganos, cruelty free e sem açúcar.","es":"Fábrica brasileña de cosméticos sensuales con más de 20 años y planta propia. Produce lubricantes, geles estimulantes, aceites de masaje, productos besables y otros artículos de bienestar íntimo, registrados en Anvisa, veganos, cruelty free y sin azúcar.","en":"Brazilian maker of sensual cosmetics with over 20 years in business and its own factory. It produces lubricants, arousal gels, massage oils, kissable products and other intimate wellness items: Anvisa-registered, vegan, cruelty-free and sugar-free.","de":"Brasilianischer Hersteller sinnlicher Kosmetik mit über 20 Jahren Erfahrung und eigener Fabrik. Produziert Gleitmittel, Stimulationsgele, Massageöle, küssbare Produkte und weitere Intimpflegeartikel: bei Anvisa registriert, vegan, tierversuchsfrei, zuckerfrei."},"src":"oficial","ig":"feiticos.br","off":"Feitiços Aromáticos"},"FHB":{"d":{"pt":"Expositor do setor Cannabis é Plural, que reúne grandes marcas, sementes e cultivo. Passe no estande para conhecer a marca e seus produtos.","es":"Expositor del sector Cannabis é Plural, que reúne grandes marcas, semillas y cultivo. Pasá por el stand para conocer la marca y sus productos.","en":"Exhibitor in the Cannabis é Plural area, home to major brands, seeds and growing. Stop by the stand to meet the brand and its products.","de":"Aussteller im Bereich Cannabis é Plural mit großen Marken, Samen und Anbau. Am Stand lernst du die Marke und ihre Produkte kennen."},"src":"gen"},"Finamore":{"lg":"assets/logos/cisne-branco-finamore-2026.webp","dk":0,"d":{"pt":"Desde 1949, a Finamore produz tabaco artesanal brasileiro e foi pioneira no tabaco para cachimbo no Brasil, com produção feita à mão.","es":"Desde 1949, Finamore elabora tabaco artesanal brasileño y fue pionera en el tabaco para pipa en Brasil, con producción hecha a mano.","en":"Since 1949, Finamore has produced Brazilian artisanal tobacco and was a pioneer of pipe tobacco in Brazil, with handmade production.","de":"Seit 1949 stellt Finamore brasilianischen Manufakturtabak her und war Pionier für Pfeifentabak in Brasilien – in Handarbeit gefertigt."},"src":"oficial","ig":"tabacosfinamore","off":"Finamore Tabacos"},"Flor da Vida":{"lg":"assets/logos/flor-da-vida.webp","dk":0,"d":{"pt":"A Associação Flor da Vida, com sede em Franca (SP), atua há 7 anos pelo acesso à cannabis medicinal no Brasil, com ações de saúde, pesquisa e acolhimento. É parceira da Prefeitura de Ribeirão Pires, responsável pela primeira clínica pública de cannabis medicinal do país.","es":"La Associação Flor da Vida, con sede en Franca (SP), trabaja hace 7 años por el acceso al cannabis medicinal en Brasil, con acciones de salud, investigación y acompañamiento. Es socia de la Prefeitura de Ribeirão Pires, a cargo de la primera clínica pública de cannabis medicinal del país.","en":"Associação Flor da Vida, based in Franca (SP), has worked for 7 years for access to medical cannabis in Brazil through health, research and patient support. It partners with Ribeirão Pires City Hall, which runs the country's first public medical cannabis clinic.","de":"Die Associação Flor da Vida aus Franca (SP) setzt sich seit 7 Jahren für den Zugang zu medizinischem Cannabis in Brasilien ein – mit Gesundheit, Forschung und Begleitung. Sie kooperiert mit der Stadt Ribeirão Pires, die die erste öffentliche Cannabis-Klinik des Landes betreibt."},"src":"oficial","ig":"associacao.flordavida","off":"Flor da Vida"},"Flora Urbana":{"lg":"assets/logos/flora-urbana.webp","dk":0,"d":{"pt":"A Flora Urbana conecta o mercado brasileiro a bancos de sementes de diferentes partes do mundo, reunindo em um só lugar uma ampla diversidade de marcas e variedades, com curadoria internacional.","es":"Flora Urbana conecta el mercado brasileño con bancos de semillas de distintas partes del mundo y reúne en un solo lugar una amplia diversidad de marcas y variedades, con curaduría internacional.","en":"Flora Urbana connects the Brazilian market with seed banks from around the world, bringing a wide range of brands and strains together in one place, with international curation.","de":"Flora Urbana verbindet den brasilianischen Markt mit Samenbanken aus aller Welt und bündelt eine große Vielfalt an Marken und Sorten an einem Ort, international kuratiert."},"src":"oficial","ig":"floraurbana021","off":"Flora Urbana"},"FlowerMed Whincbd NabisMed":{"lg":"assets/logos/flowermed.webp","dk":0,"d":{"pt":"A FlowerMed é uma empresa especializada em cannabis medicinal que trabalha com a.webp","dk":0,"d":{"pt":"Associação ligada ao tratamento com cannabis medicinal. O nome troca o “V” de “Viva” pelo “L” de leveza, liberdade e longevidade. Propõe viver com liberdade, dignidade e acesso ao cuidado que cada pessoa merece.","es":"Asociación vinculada al tratamiento con cannabis medicinal. El nombre cambia la “V” de “Viva” por la “L” de liviandad, libertad y longevidad. Propone vivir con libertad, dignidad y acceso al cuidado que cada persona merece.","en":"Association linked to medical cannabis treatment. The name swaps the “V” in “Viva” for the “L” of leveza, liberdade and longevidade (lightness, freedom, longevity). It stands for living with freedom, dignity and access to the care each person deserves.","de":"Verein rund um die Behandlung mit medizinischem Cannabis. Der Name ersetzt das „V“ von „Viva“ durch das „L“ von leveza, liberdade und longevidade (Leichtigkeit, Freiheit, Langlebigkeit). Er steht für ein Leben in Freiheit, Würde und mit Zugang zur Versorgung."},"src":"oficial","ig":"liva_brasil","off":"Associação Liva"},"Loja Oficial ExpoCannabis":{"lg":"assets/img/logo.webp","dk":1,"d":{"pt":"Loja oficial da ExpoCannabis Brasil, com os produtos e lembranças da marca do evento. Também disponível online no site da expo.","es":"Tienda oficial de ExpoCannabis Brasil, con productos y recuerdos de la marca del evento. También disponible online en el sitio de la expo.","en":"Official ExpoCannabis Brasil store, with products and souvenirs bearing the event's brand. Also available online on the expo website.","de":"Offizieller Shop der ExpoCannabis Brasil mit Produkten und Souvenirs der Veranstaltungsmarke. Auch online auf der Website der Messe erhältlich."},"src":"web","web":"https://expocannabisbrasil.com/loja/","ig":"expocannabis.brasil"},"Lot420":{"lg":"assets/logos/lot420.webp","dk":0,"d":{"pt":"A LOT420 é uma produtora licenciada de cannabis de Eastern Townships, Quebec (Canadá), fundada em 2015. Cultiva pequenos lotes com genética selecionada para o mercado recreativo canadense, pacientes medicinais e mercados médicos internacionais.","es":"LOT420 es una productora licenciada de cannabis de Eastern Townships, Quebec (Canadá), fundada en 2015. Cultiva lotes pequeños con genética seleccionada para el mercado recreativo canadiense, pacientes medicinales y mercados médicos internacionales.","en":"LOT420 is a licensed cannabis producer in the Eastern Townships, Quebec (Canada), founded in 2015. It grows small batches of selected genetics for Canada's recreational market, medical patients and international medical markets.","de":"LOT420 ist ein lizenzierter Cannabisproduzent aus den Eastern Townships in Quebec (Kanada), gegründet 2015. Angebaut werden kleine Chargen ausgewählter Genetik für den kanadischen Freizeitmarkt, Patienten und internationale medizinische Märkte."},"src":"oficial","web":"https://www.lot420.com/","ig":"lot4_aaaa","off":"Lot420"},"Magic Medic":{"lg":"assets/logos/magic-medic.webp","dk":0,"d":{"pt":"Fabricante de bolsas térmicas de calor instantâneo para o conforto e bem-estar do corpo, da cabeça aos pés.","es":"Fabricante de bolsas térmicas de calor instantáneo para el confort y el bienestar del cuerpo, de la cabeza a los pies.","en":"Manufacturer of instant-heat thermal packs for comfort and well-being, from head to toe.","de":"Hersteller von Wärmekissen mit Sofortwärme für Komfort und Wohlbefinden von Kopf bis Fuß."},"src":"oficial","ig":"magicmedic2","off":"Magic Medic"},"Mano Grow":{"lg":"assets/logos/manogrow.webp","dk":0,"d":{"pt":"A Mano Grow desenvolve fertilizantes para cultivo que unem natureza e ciência. A linha é de fácil uso, pensada para o ciclo completo, com formulações ricas em matéria orgânica, pH controlado e nutrientes quelatizados.","es":"Mano Grow desarrolla fertilizantes para cultivo que combinan naturaleza y ciencia. La línea es fácil de usar, pensada para el ciclo completo, con formulaciones ricas en materia orgánica, pH controlado y nutrientes quelatados.","en":"Man arpintería de autor de Rodolfo Rodrigues. Nacida del reaprovechamiento de materiales, hoy trabaja con madera maciza, mobiliario de autor y estructuras geodésicas. En la Expo presenta accesorios y muebles para el universo cannábico.","en":"Paletes & Pinus is the signature woodworking brand of Rodolfo Rodrigues. Born from material reuse, it now works with solid wood, original furniture and geodesic structures. At the Expo it shows accessories and furniture for the cannabis world.","de":"Paletes & Pinus ist die Autorenschreinerei von Rodolfo Rodrigues. Aus der Wiederverwendung von Materialien entstanden, arbeitet sie heute mit Massivholz, eigenen Möbeln und geodätischen Strukturen. Auf der Expo zeigt sie Zubehör und Möbel rund um Cannabis."},"src":"oficial","ig":"rodolforodriguesatelier","off":"Paletes & Pinus"},"Papelito":{"lg":"assets/logos/papelito.webp","dk":1,"d":{"pt":"Marca brasileira com produção própria de uma linha completa de sedas, piteiras, filtros e acessórios, com foco em inovação e sustentabilidade. Presente em todo o Brasil e em expansão pela América Latina. Patrocinadora Master da ExpoCannabis Brasil 2026.","es":"Marca brasileña con producción propia de una línea completa de papeles, boquillas, filtros y accesorios, con foco en innovación y sustentabilidad. Presente en todo Brasil y en expansión por América Latina. Patrocinadora Master de ExpoCannabis Brasil 2026.","en":"Brazilian brand producing its own full line of rolling papers, tips, filters and accessories, with a focus on innovation and sustainability. Present across Brazil and expanding in Latin America. Master Sponsor of ExpoCannabis Brasil 2026.","de":"Brasilianische Marke mit eigener Produktion von Blättchen, Mundstücken, Filtern und Zubehör, mit Fokus auf Innovation und Nachhaltigkeit. In ganz Brasilien vertreten und in Lateinamerika auf Expansionskurs. Master-Sponsor der ExpoCannabis Brasil 2026."},"src":"oficial","ig":"papelitobrasil","off":"Papelito"},"Paradise Seeds":{"d":{"pt":"Paradise Seeds é um banco de sementes de cannabis fundado em Amsterdã em 1994. Desenvolve genéticas feminizadas, automáticas e regulares, incluindo variedades ricas em CBD, como Sensi Star, Jacky White e Delahaze.","es":"Paradise Seeds es un banco de semillas de cannabis fundado en Ámsterdam en 1994. Desarrolla genéticas feminizadas, automáticas y regulares, incluidas variedades ricas en CBD, como Sensi Star, Jacky White y Delahaze.","en":"Paradise Seeds is a cannabis seed bank founded in Amsterdam in 1994. It breeds feminized, autoflowering and regular genetics, including CBD-rich varieties, with strains such as Sensi Star, Jacky White and Delahaze.","de":"Paradise Seeds ist eine 1994 in Amsterdam gegründete Cannabis-Samenbank. Sie züchtet feminisierte, autoflowering und reguläre Genetiken, darunter CBD-reiche Sorten wie Sensi Star, Jacky White und Delahaze."},"src":"web","web":"https://www.paradise-seeds.com/"},"Pay-Pay":{"d":{"pt":"Pay-Pay é uma marca espanhola de papéis para enrolar, originária de Alcoy e considerada uma das mais antigas do mundo ainda em atividade. Oferece sedas em diversos formatos e linhas.","es":"Pay-Pay es una marca española de papeles para armar, originaria de Alcoy y considerada una de las más antiguas del mundo todavía en actividad. Ofrece papeles en diversos formatos y líneas.","en":"Pay-Pay is a Spanish rolling paper brand from Alcoy, considered one of the oldest still in operation worldwide. It offers papers in a variety of formats and lines.","de":"Pay-Pay ist eine spanische Marke für Zigarettenpapier aus Alcoy und gilt als eine der ältesten noch aktiven weltweit. Sie bietet Papers in verschiedenen Formaten und Linien an."},"src":"web","off":"Pay-Pay"},"Pegada 011":{"lg":"assets/logos/pegada-011.webp","dk":0,"d":{"pt":"A Pegada 011 é uma marca feminina de São Paulo, ativa desde 2018, que produz velas e incensos ligados à cultura urbana e canábica. Todas as peças são feitas com pavio de cânhamo.","es":"Pegada 011 es una marca femenina de São Paulo, activa desde 2018, que produce velas e inciensos vinculados a la cultura urbana y cannábica. Todas las piezas llevan mecha de cáñamo.","en":"Pegada 011 is a women's brand from São Paulo, active since 2018, making candles and incense rooted in urban and cannabis culture. Every piece is made with a hemp wick.","de":"Pegada 011 ist eine feminine Marke aus São Paulo, seit 2018 aktiv, die Kerzen und Räucherwerk aus der urbanen und Cannabiskultur herstellt. Alle Stücke haben einen Hanfdocht."},"src":"oficial","ig":"pegada_011","off":"Pegada 011"},"Pet Cannabis":{"lg":"assets/logos/associacao-pet-cannabis-selo.webp","dk":0,"d":{"pt":"Expositor do setor Cannabis é Plural com foco no universo pet, segundo o nome da marca. Passe no estande para conhecer a proposta e os produtos.","es":"Expositor del sector Cannabis é Plural con foco en el mundo de las mascotas, según el nombre de la marca. Pasá por el stand para conocer su propuesta y productos.","en":"Exhibitor in the Cannabis é Plural sector, focused on pets as its name suggests. Stop by the stand to learn about its offering and products.","de":"Aussteller im Bereich Cannabis é Plural mit Fokus auf Haustiere, wie der Markenname andeutet. Besuchen Sie den Stand, um Angebot und Produkte kennenzulernen."},"src":"gen","ig":"dr.petcannabisoficial1","off":"Associação Pet Cannabis"},"Pietricovsky Advocacia":{"lg":"assets/logos/pietricovsky-advocacia.webp","dk":0,"d":{"pt":"Desde 2017, o escritório presta assessoria jurídica a pacientes, associações e empresas na defesa do acesso à cannabis medicinal. Na Expo, a equipe do Dr. Gabriel Dutra Pietricovsky trata de habeas corpus para cultivo, direito à saúde e questões regulatórias.","es":"Desde 2017, el estudio brinda asesoramiento jurídico a pacientes, asociaciones y empresas en defensa del acceso al cannabis medicinal. En la Expo, el equipo del Dr. Gabriel Dutra Pietricovsky aborda habeas corpus para cultivo, derecho a la salud y temas regulatorios.","en":"Since 2017, the firm has provided legal advice to patients, associations and companies to defend access to medical cannabis. At the Expo, Dr. Gabriel Dutra Pietricovsky's team covers habeas corpus for cultivation, the right to health and regulatory issues.","de":"Seit 2017 berät die Kanzlei Patienten, Vereinigungen und Unternehmen rechtlich und setzt sich für den Zugang zu medizinischem Cannabis ein. Auf der Expo informiert das Team von Dr. Gabriel Dutra Pietricovsky über Habeas Corpus für den Anbau, Recht auf Gesundheit und Regulierung."},"src":"oficial","off":"Pietricovsky Advocacia"},"Pirateria":{"lg":"assets/logos/pirateria.webp","dk":0,"d":{"pt":"Marca de acessórios fundada em 2020, com foco em identidade, autenticidade e cultura. Oferece piteiras, potes herméticos, cases de proteção e outros produtos para o dia a dia.","es":"Marca de accesorios fundada en 2020, con foco en identidad, autenticidad y cultura. Ofrece boquillas, frascos herméticos, estuches protectores y otros productos para el día a día.","en":"Accessories brand founded in 2020, focused on identity, authenticity and culture. It offers tips, airtight jars, protective cases and other everyday products.","de":"Zubehörmarke, gegründet 2020, mit Fokus auf Identität, Authentizität und Kultur. Bietet Mundstücke, luftdichte Behälter, Schutzhüllen und weitere Produkte für den Alltag."},"src":"oficial","ig":"pirateria710","off":"Pirateria"},"Plagron":{"lg":"assets/logos/plagron.webp","dk":0,"d":{"pt":"Desde 1992, a Plagron desenvolve e produz na Holanda nutrientes, substratos e aditivos para cultivo, apoiando cultivadores em todo o mundo em todas as etapas. Agora chega ao mercado brasileiro.","es":"Desde 1992, Plagron desarrolla y produce en los Países Bajos nutrientes, sustratos y aditivos para cultivo, y acompaña a cultivadores de todo el mundo en todas las etapas. Ahora llega al mercado brasileño.","en":"Since 1992, Plagron has developed and produced nutrients, substrates and additives in the Netherlands, supporting growers worldwide at every stage of cultivation. It is now entering the Brazilian market.","de":"Seit 1992 entwickelt und produziert Plagron in den Niederlanden Nährstoffe, Substrate und Zusätze und unterstützt Grower weltweit in allen Anbauphasen. Jetzt startet die Marke auf dem brasilianischen Markt."},"src":"oficial","web":"https://www.plagron.com/","ig":"plagron_official","off":"Plagron"},"Poison Dealer":{"lg":"assets/logos/poison-dealer.webp","dk":0,"d":{"pt":"A Poison Dealer é uma marca de cultura alternativa que une tecnologia, expressão simbólica e espiritualidade urbana. Suas peças combinam tecidos fotoluminescentes, modelagens não convencionais e códigos ancestrais com glitches contemporâneos.","es":"Poison Dealer es una marca de cultura alternativa que une tecnología, expresión simbólica y espiritualidad urbana. Sus prendas combinan telas fotoluminiscentes, moldería no convencional y códigos ancestrales con glitches contemporáneos.","en":"Poison Dealer is an alternative culture brand combining technology, symbolic expression and urban spirituality. Its pieces mix photoluminescent fabrics, unconventional cuts and ancestral codes with contemporary glitches.","de":"Poison Dealer ist eine Marke der Alternativkultur, die Technologie, symbolischen Ausdruck und urbane Spiritualität verbindet. Ihre Stücke kombinieren fotolumineszente Stoffe, unkonventionelle Schnitte und überlieferte Codes mit zeitgenössischen Glitches."},"src":"oficial","ig":"poisonresistance_","off":"Poison Dealer"},"Popipe":{"lg":"assets/logos/popipe.webp","dk":0,"d":{"pt":"Headshop fundada em São Paulo em 2009, inspirada nas headshops europeias e na contracultura. Oferece uma curadoria de produtos de tabacaria e cultura canábica, com loja física nos Jardins e e-commerce com alcance nacional.","es":"Headshop fundado en São Paulo en 2009, inspirado en los headshops europeos y la contracultura. Ofrece una selección curada de productos de tabaquería y cultura cannábica, con local en el barrio Jardins y tienda online con alcance nacional.","en":"Headshop founded in São Paulo in 2009, inspired by European headshops and counterculture. It offers a curated range of smoking and cannabis-culture products, with a physical store in Jardins and nationwide e-commerce.","de":"Headshop, 2009 in São Paulo gegründet, inspiriert von europäischen Headshops und der Gegenkultur. Bietet eine kuratierte Auswahl an Raucher- und Cannabiskultur-Produkten, mit Ladengeschäft im Viertel Jardins und landesweitem Onlineshop."},"src":"oficial","web":"https://www.popipe.com.br/","ig":"popipeheadshop","off":"Popipe"},"Projeto THC":{"lg":"assets/logos/projeto-thc.webp","dk":0,"d":{"pt":"O Projeto THC (Tecnologia, História e Ciência) liga a ExpoCannabis à universidade pública. Coordenado pelas ligas acadêmicas LACAM (UFRRJ) e NEICANN (UNESP Botucatu), oferece exposições interativas, jogos educativos e cartilhas sobre cannabis.","es":"El Projeto THC (Tecnologia, História e Ciência) une la ExpoCannabis con la universidad pública. Coordinado por las ligas académicas LACAM (UFRRJ) y NEICANN (UNESP Botucatu), ofrece exposiciones interactivas, juegos educativos y cartillas sobre cannabis.","en":"Projeto THC (Technology, History and Science) links ExpoCannabis with public universities. Run by the student groups LACAM (UFRRJ) and NEICANN (UNESP Botucatu), it offers interactive exhibits, educational games and booklets on cannabis.","de":"Das Projeto THC (Technologie, Geschichte und Wissenschaft) verbindet die ExpoCannabis mit der öffentlichen Universität. Getragen von den Studierendengruppen LACAM (UFRRJ) und NEICANN (UNESP Botucatu), bietet es interaktive Ausstellungen, Lernspiele und Broschüren zu Cannabis."},"src":"oficial","ig":"lacam.ufrrj","off":"Projeto THC"},"Puff Life / Squadafum":{"lg":"assets/logos/puff-life-squadafum.webp","dk":0,"d":{"pt":"Nascida em 2016, a Puff Life parte da cultura canábica para construir um lifestyle que valoriza paz, consciência, equilíbrio, inclusão e representatividade.","es":"Nacida en 2016, Puff Life parte de la cultura cannábica para construir un lifestyle que valora la paz, la conciencia, el equilibrio, la inclusión y la representatividad.","en":"Founded in 2016, Puff Life starts from cannabis culture to build a lifestyle that values peace, awareness, balance, inclusion and representation.","de":"Puff Life wurde 2016 gegründet und baut, ausgehend von der Cannabiskultur, einen Lifestyle auf, der Frieden, Bewusstsein, Ausgeglichenheit, Inklusion und Repräsentation in den Mittelpunkt stellt."},"src":"oficial","ig":"pufflifebr","off":"Puff Life"},"Puffco":{"lg":"assets/logos/puffco.webp","dk":0,"d":{"pt":"Marca pioneira em dab rigs eletrônicos e acessórios, que desenvolve tecnologia e produtos para a experiência de dabbing, com foco em design, qualidade e comunidade.","es":"Marca pionera en dab rigs electrónicos y accesorios, que desarrolla tecnología y productos para la experiencia de dabbing, con foco en diseño, calidad y comunidad.","en":"Brand that pioneered electronic dab rigs and accessories, developing technology and products for the dabbing experience, with a focus on design, quality and community.","de":"Pionier bei elektronischen Dab-Rigs und Zubehör. Entwickelt Technologie und Produkte fürs Dabbing, mit Fokus auf Design, Qualität und Community."},"src":"oficial","web":"https://www.puffco.com/","ig":"puffco","off":"Puffco"},"Pure Instinto":{"lg":"assets/logos/pure-instinto.webp","dk":0,"d":{"pt":"Empresa europeia fundada em 2018, com trajetória iniciada em Amsterdã em 2008, especializada em melhoramento, seleção e produção de sementes de cannabis. Catálogo: feminizadas, autoflorescentes, ricas em CBD, linhas USA e Exotic e seleções para extração.","es":"Empresa europea fundada en 2018, con trayectoria iniciada en Ámsterdam en 2008, especializada en mejoramiento, selección y producción de semillas de cannabis. Catálogo: feminizadas, autoflorecientes, ricas en CBD, líneas USA y Exotic y selecciones para extracción.","   lo=MY0+h/2-mt;hi=MY1-h/2+mb;const fc=f.y+f.h/2;cy=lo>hi?fc:Math.min(hi,Math.max(lo,cy));

const SND={on:true,ctx:null,out:null};

  const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+dur*.4);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp).connect(g).connect(SND.out);s.start(t);s.stop(t+dur)}

  case'tap':tone(NOTE.A5,0,.07,'sine',.06);tone(NOTE.E6,0,.04,'triangle',.02);break;
  case'open':tone(NOTE.E5,0,.16,'triangle',.09);tone(NOTE.A5,.07,.22,'triangle',.08);break;
